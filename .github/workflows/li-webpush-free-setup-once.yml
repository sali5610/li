name: li. Free Web Push — PO-approved one-time Free setup
on:
  push:
    branches:
      - infra/li-webpush-setup-approved-20261122
    paths:
      - '.github/workflows/li-webpush-free-setup-once.yml'
      - 'tools/push-worker/scripts/free_setup_preflight.py'
      - 'tools/push-worker/scripts/provision_free_once.py'
permissions:
  contents: read
concurrency:
  group: li-webpush-free-setup-approved-20261122
  cancel-in-progress: false
jobs:
  prerequisites:
    if: github.repository == 'sali5610/li' && github.ref == 'refs/heads/infra/li-webpush-setup-approved-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.LI_PUSH_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate setup script syntax and reuse tested Push Worker
        run: |
          python3 -m py_compile tools/push-worker/scripts/free_setup_preflight.py tools/push-worker/scripts/provision_free_once.py
          npm install --no-audit --no-fund --prefix tools/push-worker
          npm run check --prefix tools/push-worker
          cd tools/push-worker
          npx wrangler deploy --dry-run --outdir /tmp/li-webpush-free-provision-check
          test -s /tmp/li-webpush-free-provision-check/index.js
      - name: Verify Workers Free account and resume only the pre-existing approved D1
        env:
          LI_APPROVED_D1_RESUME: FREE_WEBPUSH_20261122
        run: python3 tools/push-worker/scripts/free_setup_preflight.py
      - name: Provision exactly one Free D1, VAPID and dedicated Worker
        env:
          LI_APPROVED_SETUP: FREE_WEBPUSH_20261122
        run: python3 tools/push-worker/scripts/provision_free_once.py --apply
      - name: Record deployment boundary
        run: echo 'Dedicated Push Worker setup complete; Cloudflare Pages release is separate and NOT triggered.'
