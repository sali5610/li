name: li. Design System Contract

on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/assets/*.css'
      - 'site/lessons/**'
      - 'design-system/**'
      - 'tools/generate_design_tokens.py'
      - 'tools/validate_design_system.py'
      - 'tools/validate_ui_foundations.py'
      - 'tools/audit_design_tokens.py'
      - '.github/workflows/li-design-contract.yml'
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/*.css'
      - 'site/lessons/**'
      - 'design-system/**'
      - 'tools/generate_design_tokens.py'
      - 'tools/validate_design_system.py'
      - 'tools/validate_ui_foundations.py'
      - 'tools/audit_design_tokens.py'
      - '.github/workflows/li-design-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-design-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical generated design tokens
        run: python3 tools/generate_design_tokens.py --check
      - name: Check shared design token and interaction contracts
        run: python3 tools/validate_design_system.py
      - name: Check readable type and 4px layout grid
        run: python3 tools/validate_ui_foundations.py
      - name: Check authored component token debt
        run: python3 tools/audit_design_tokens.py --check-zero
      - name: Check legacy intrinsic and scene debt baseline
        run: python3 tools/audit_design_tokens.py --check-baseline
