<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Step16.2 Vanilla shell React island integration</title></head><body>
<pre id="result">LI_STEP16_L09_SHELL_PENDING</pre>
<script>
(async()=>{
 'use strict';
 const result=document.getElementById('result'),checks=[];
 const key='step16.l09.react-island.v1',nativeKey='li.review.L09-1-2.v1';
 const assert=(x,m)=>{if(!x)throw Error(m)};
 const sleep=t=>new Promise(r=>setTimeout(r,t));
 async function wait(test,msg){for(let i=0;i<350;i++){if(test())return;await sleep(40)}throw Error('TIMEOUT '+msg)}
 let frame;
 async function load(flag,width=390,mode='l09'){
  frame?.remove();
  frame=document.createElement('iframe');
  frame.style.cssText='position:absolute;left:-10000px;top:0;border:0;width:'+width+'px;height:860px';
  frame.src='../../site/index.html?lesson=L09-1-2'+(flag?'&li-react='+encodeURIComponent(mode):'');
  document.body.append(frame);
  await wait(()=>frame.contentDocument?.readyState==='complete' &&
    frame.contentDocument?.getElementById('page-lessonL09'),'existing app navigation & lesson route');
  return frame.contentDocument;
 }
 try{
  const realBaseline=localStorage.getItem(nativeKey);
  localStorage.removeItem(key);
  let doc=await load(false);
  await wait(()=>doc.querySelector('#l09-questions textarea'),'default authored native L09');
  assert(!doc.getElementById('li-step16-l09-react-host'),'Flag OFF must not mount React');
  assert(doc.querySelector('#page-lessonL09').dataset.liRuntime!=='react-candidate','Flag OFF was hijacked');
  checks.push('Feature OFF keeps the complete existing native L09 screen and editing behavior');
  const visitsBaseline=localStorage.getItem('li.private.lesson.visits.v1');
  doc=await load(true);
  await wait(()=>doc.querySelector('#page-lessonL09')?.dataset.liRuntime==='react-candidate','React mounted in native shell');
  const page=doc.querySelector('#page-lessonL09'),react=doc.querySelector('#li-step16-l09-react-host');
  assert(react&&react.querySelector('.pilot [data-answer="0"]'),'React challenge not mounted');
  assert(doc.querySelector('#l09-challenge').hidden&&doc.querySelector('#l09-challenge').inert &&
    doc.querySelector('#l09-rubric').hidden&&doc.querySelector('#l09-rubric').inert,
    'Original challenge/rubric still interactive behind React');
  assert(!doc.querySelector('#l09-concept').hidden&&!doc.querySelector('#l09-guided').hidden &&
    !doc.querySelector('#l09-sources').hidden,'Native theory, guided practice or citations were hidden');
  checks.push('React replaces challenge/rubric only; original theory, guided practice and sources remain available');
  assert(doc.querySelector('.header .brand')&&doc.querySelector('.mobile-nav')&&doc.querySelector('#page-catalog'),
    'Original navigation or other screens removed');
  checks.push('Header, mobile navigation and all non-L09 Vanilla screens remain untouched');
  assert(react.querySelector('.pilot').dataset.storageKey===key,'React candidate used the real native key');
  assert(localStorage.getItem(nativeKey)===realBaseline,'Native learner record touched');
  checks.push('React candidate writes to an isolated experiment key; native learner key stays untouched');
  const t=react.querySelector('[data-answer="0"]');
  const d=Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLTextAreaElement.prototype,'value');
  d.set.call(t,'Synthetic experiment answer long enough to save locally');
  t.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));
  await wait(()=>JSON.parse(localStorage.getItem(key)||'null')?.draft?.[0]?.includes('Synthetic experiment'),'React autosave');
  assert(localStorage.getItem(nativeKey)===realBaseline,'React overwrote native attempt');
  checks.push('Real React textarea persists its draft, without touching existing native data');
  assert(react.querySelector('[data-action="submit"]')&&react.querySelector('[data-rubric-locked]'),
    'Candidate lost submission/rubric gate');
  assert(react.querySelector('[data-status]')?.getAttribute('role')==='status',
    'Candidate status is not announced');
  checks.push('Source-backed submit/rubric gate and accessible status survive native-shell mount');
  const css=frame.contentWindow.getComputedStyle(react.querySelector('[data-action="submit"]'));
  assert(parseFloat(css.minHeight)>=48,'React touch target below 48px');
  assert(react.querySelector('.pilot').getBoundingClientRect().width <= 395,'React overflow at 390px');
  checks.push('390px screen retains mobile touch targets and responsive content');
  doc=await load(true,820);
  await wait(()=>doc.querySelector('#page-lessonL09')?.dataset.liRuntime==='react-candidate','820px mount');
  assert(doc.querySelector('.pilot')&&doc.querySelector('.header'),'820px shell missing');
  assert(localStorage.getItem('li.private.lesson.visits.v1')===visitsBaseline,
    'Research-only React visit was inserted into real learning history');
  checks.push('820px screen mounts React without losing Vanilla shell');
  checks.push('Research-only navigation leaves real lesson visit history unchanged');

  // Synthetic *shared* fixture: same native-shaped record, but NEVER the
  // genuine li.review.* learner key. Both frameworks may read; React owns
  // independent challenge and rubric while native guided exercise stays live.
  const shared='step16.l09.shared-native-fixture.v1';
  const seed={
    locale:'vi',draft:[
      'Shared fixture first response about target population.',
      'Shared fixture second response about sampling bias.',
      'Shared fixture third response with bounded claim.',
      'Shared fixture fourth response about evidence limitations.'
    ],
    guidedDraft:'Initial guided synthetic text',hint:false,assisted:false,
    submitted:false,submittedAt:null,submission:null,submissionLocale:null,
    ratings:[null,null,null,null],reviewed:false,
    futurePrivate:{mustRetain:'unknown forward schema'}
  };
  frame.remove();localStorage.setItem(shared,JSON.stringify(seed));
  doc=await load(true,390,'l09-native-fixture');
  await wait(()=>doc.querySelector('#page-lessonL09')?.dataset.liRuntime==='react-candidate','shared owner mount');
  const sharedReact=()=>doc.querySelector('#li-step16-l09-react-host');
  const sharedState=()=>JSON.parse(localStorage.getItem(shared)||'null');
  assert(sharedReact().querySelector('.pilot').dataset.storageKey===shared,
    'React did not bind synthetic shared fixture key');
  assert(sharedReact().querySelector('[data-answer="0"]').value===seed.draft[0],
    'React did not hydrate legacy-shaped synthetic record');
  assert(doc.querySelector('#l09-guidedDraft').value===seed.guidedDraft,
    'Native guided response was not restored');
  assert(localStorage.getItem(nativeKey)===realBaseline,'Shared fixture contaminated real learner data');
  assert(doc.querySelector('#page-lessonL09').dataset.liResearchStage==='draft' &&
    doc.getElementById('l09-progressBar').getAttribute('aria-valuenow')==='0',
    'The synthetic lesson progress started from an incorrect review stage');
  assert(doc.getElementById('l09-progress').textContent.includes('thử nghiệm'),
    'Synthetic research progress is not visibly labeled');
  checks.push('Local shared fixture hydrates existing native-shaped L09 attempt in both frameworks without touching real key');
  checks.push('Progress projects draft-only synthetic state, 0/1 review without fake completed lesson');
  const change=(selector,value)=>{
    const node=doc.querySelector(selector);
    assert(node&&!node.disabled,'Missing enabled editor '+selector);
    Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLTextAreaElement.prototype,'value').set.call(node,value);
    node.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));
  };
  change('#li-step16-l09-react-host [data-answer="0"]','React fixture new answer with enough detail');
  await wait(()=>sharedState()?.draft?.[0]?.startsWith('React fixture'),'React shared write');
  assert(sharedState().futurePrivate.mustRetain==='unknown forward schema','Future field erased');
  checks.push('React safely saves to the shared synthetic record and preserves unknown legacy fields');
  const beforeLegacy=localStorage.getItem(shared);
  change('#l09-question-0','Hidden Vanilla stale write must not win');
  await new Promise(r=>setTimeout(r,60));
  assert(localStorage.getItem(shared)===beforeLegacy,'Hidden native challenge clobbered React writer');
  checks.push('Native hidden challenge cannot overwrite React-owned record, even if a stale handler fires');
  change('#l09-guidedDraft','Native guided draft updated independently');
  await wait(()=>sharedState()?.guidedDraft==='Native guided draft updated independently','native field-level guided patch');
  assert(sharedState().draft[0].startsWith('React fixture')&&
    sharedState().futurePrivate.mustRetain==='unknown forward schema',
    'Native guided draft clobbered React answer or future schema');
  checks.push('Native guided editor patches only guidedDraft while React owns challenge/rubric');
  change('#li-step16-l09-react-host [data-answer="1"]','Conflicting React stale answer should be blocked');
  await wait(()=>!!sharedReact().querySelector('[data-conflict]'),'stale React detects same-tab guided patch');
  assert(sharedState().draft[1]===seed.draft[1],
    'React stale state overwrote native guided record');
  sharedReact().querySelector('[data-action="reload-state"]').click();
  await wait(()=>!sharedReact().querySelector('[data-conflict]'),'React explicit rehydrate');
  assert(sharedReact().querySelector('[data-answer="0"]').value.startsWith('React fixture'),
    'Explicit rehydrate lost latest React text');
  checks.push('React detects same-tab stale baseline and requires explicit refresh; no silent overwrite');
  assert(sharedState().draft.every(answer=>answer.trim().length>=12),'Synthetic submit prerequisites missing');
  let realSubmitEvents=0;
  frame.contentWindow.addEventListener('li:lesson-submitted',()=>realSubmitEvents++);
  sharedReact().querySelector('[data-action="submit"]').click();
  await wait(()=>sharedState()?.submitted===true&&!!sharedReact().querySelector('[data-rubric]'),
    'React shared submit');
  await wait(()=>doc.querySelector('#page-lessonL09').dataset.liResearchStage==='submitted','submitted progress projection');
  assert(realSubmitEvents===0,'Synthetic submission entered real lesson activity feed');
  assert(doc.getElementById('l09-progressBar').getAttribute('aria-valuenow')==='0',
    'Submitting was misrepresented as completed self-review');
  checks.push('Submitted React attempt projects 0/1 pending review; synthetic event never enters genuine activity');
  assert(sharedState().submission.length===4&&
    localStorage.getItem(nativeKey)===realBaseline,'Shared submission touched production learner key');
  doc=await load(true,390,'l09-native-fixture');
  await wait(()=>doc.querySelector('#page-lessonL09')?.dataset.liRuntime==='react-candidate','native reload shared');
  assert(!doc.getElementById('l09-answerBox').hidden&&
    doc.querySelector('#l09-question-0').disabled,
    'Vanilla could not reload submitted React attempt');
  checks.push('Vanilla source reload reads React-submitted attempt, preserving answer gate and lock');
  assert(doc.querySelector('#page-lessonL09').dataset.liResearchStage==='submitted',
    'Reload changed submitted progress');
  assert(typeof frame.contentWindow.liStep16Fixture?.capture==='function' &&
    typeof frame.contentWindow.liStep16Fixture?.rollback==='function',
    'Local research rollback API unavailable');
  const checkpoint=frame.contentWindow.liStep16Fixture.capture();
  const ratingChange=(index,value)=>{
    const select=doc.querySelector('[data-rating="'+index+'"]');
    Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLSelectElement.prototype,'value').set.call(select,String(value));
    select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
  };
  [0,1,2,2].forEach((value,i)=>ratingChange(i,value));
  await wait(()=>sharedState()?.ratings?.every(v=>v!==null),'rubric review draft saved');
  sharedReact().querySelector('[data-action="finish"]').click();
  await wait(()=>sharedState()?.reviewed===true,'React review completed');
  await wait(()=>doc.querySelector('#page-lessonL09').dataset.liResearchStage==='reviewed','review projection');
  assert(doc.getElementById('l09-progressBar').getAttribute('aria-valuenow')==='1' &&
    doc.getElementById('l09-progressFill').style.width==='100%' &&
    doc.getElementById('l09-progress').textContent.includes('tự đánh giá'),
    'Self-review progress projection is not honest');
  assert(localStorage.getItem(nativeKey)===realBaseline,'Demo review wrote genuine learner key');
  checks.push('Self-review projects 1/1 and resume text without claiming mastery or writing genuine progress');
  const reviewedRaw=localStorage.getItem(shared);
  let denied=false;
  try{frame.contentWindow.liStep16Fixture.rollback(checkpoint,reviewedRaw,false)}catch{denied=true}
  assert(denied&&localStorage.getItem(shared)===reviewedRaw,'Rollback without confirmation modified data');
  denied=false;
  try{frame.contentWindow.liStep16Fixture.rollback(checkpoint,'stale expected bytes',true)}catch{denied=true}
  assert(denied&&localStorage.getItem(shared)===reviewedRaw,'Stale rollback overwrote latest progress');
  checks.push('Rollback requires explicit confirmation and exact expected current record');
  assert(frame.contentWindow.liStep16Fixture.rollback(checkpoint,reviewedRaw,true)===checkpoint.raw,
    'Confirmed rollback did not return exact backup bytes');
  await wait(()=>doc.querySelector('#page-lessonL09').dataset.liResearchStage==='submitted','rollback projection');
  assert(sharedState().reviewed===false &&
    doc.getElementById('l09-progressBar').getAttribute('aria-valuenow')==='0' &&
    !!sharedReact().querySelector('[data-conflict]'),
    'Rollback did not revert review stage and mark React view stale');
  sharedReact().querySelector('[data-action="reload-state"]').click();
  await wait(()=>!sharedReact().querySelector('[data-conflict]'),'explicit state reload after rollback');
  assert(!sharedReact().querySelector('[data-reviewed]')&&
    sharedReact().querySelector('[data-rubric]'),'React did not rehydrate restored submitted state');
  checks.push('Confirmed synthetic rollback restores exact submission and forces explicit React rehydration');
  doc=await load(true,390,'l09-native-fixture');
  await wait(()=>doc.querySelector('#page-lessonL09').dataset.liRuntime==='react-candidate','vanilla reload after rollback');
  assert(doc.querySelector('#page-lessonL09').dataset.liResearchStage==='submitted' &&
    !doc.getElementById('l09-answerBox').hidden &&
    sharedState().reviewed===false,
    'Native could not resume recovered pre-review state');
  checks.push('Reload after rollback preserves native submitted answer gate and pending review status');
  const last=JSON.parse(localStorage.getItem(shared));
  assert(last.guidedDraft==='Native guided draft updated independently'&&
    last.futurePrivate.mustRetain==='unknown forward schema'&&
    localStorage.getItem(nativeKey)===realBaseline,
    'Final shared fixture mixed up guided, future or real state');
  assert(localStorage.getItem('li.private.lesson.visits.v1')===visitsBaseline,
    'Synthetic handover created a real lesson visit');
  checks.push('Shared synthetic handover retains guided/future fields and never writes production key');
  checks.push('Rollback and synthetic reload leave real visit history and original learner state byte-identical');
  frame.remove();localStorage.removeItem(shared);localStorage.removeItem(key);
  result.textContent='LI_STEP16_L09_SHELL_PASS '+JSON.stringify({count:checks.length,checks,note:'localhost-only; local isolated key; no production deploy, cross-device sync, Google Auth or Safari pass'});
 }catch(e){
  const d=frame?.contentDocument,win=frame?.contentWindow;
  const diagnostic={runtime:d?.querySelector('#page-lessonL09')?.dataset.liRuntime,
    hasLoader:!!d?.querySelector('script[src*="step16-react-router"]'),
    mountError:d?.querySelector('#page-lessonL09')?.dataset.liReactError,
    host:!!d?.getElementById('li-step16-l09-react-host'),
    fallback:d?.querySelector('#l09-challenge [role="status"]')?.textContent,
    jsAsset:await fetch('../../site/assets/step16-l09-island.js').then(x=>x.status).catch(()=>null),
    cssAsset:await fetch('../../site/assets/step16-l09-island.css').then(x=>x.status).catch(()=>null),
    route:win?.location.href};
  frame?.remove();localStorage.removeItem(key);localStorage.removeItem('step16.l09.shared-native-fixture.v1');
  result.textContent='LI_STEP16_L09_SHELL_FAIL '+JSON.stringify({checks,error:e.stack||String(e),diagnostic});
 }
})();
</script></body></html>
