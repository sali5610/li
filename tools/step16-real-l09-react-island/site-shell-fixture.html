<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Step16.2 Vanilla shell React island integration</title></head><body>
<pre id="result">LI_STEP16_L09_SHELL_PENDING</pre>
<script>
(async()=>{
 'use strict';
 const result=document.getElementById('result'),checks=[];
 const key='step16.l09.react-island.v1',nativeKey='li.review.L09-1-2.v1';
 const assert=(x,m)=>{if(!x)throw Error(m)};
 const sleep=t=>new Promise(r=>setTimeout(r,t));
 async function wait(test,msg){for(let i=0;i<350;i++){if(test())return;await sleep(40)}throw Error('TIMEOUT '+msg)}
 let frame;
 async function load(flag,width=390){
  frame?.remove();
  frame=document.createElement('iframe');
  frame.style.cssText='position:absolute;left:-10000px;top:0;border:0;width:'+width+'px;height:860px';
  frame.src='../../site/index.html?lesson=L09-1-2'+(flag?'&li-react=l09':'');
  document.body.append(frame);
  await wait(()=>frame.contentDocument?.readyState==='complete' &&
    frame.contentDocument?.getElementById('page-lessonL09'),'existing app navigation & lesson route');
  return frame.contentDocument;
 }
 try{
  localStorage.removeItem(key);localStorage.removeItem(nativeKey);
  let doc=await load(false);
  await wait(()=>doc.querySelector('#l09-questions textarea'),'default authored native L09');
  assert(!doc.getElementById('li-step16-l09-react-host'),'Flag OFF must not mount React');
  assert(doc.querySelector('#page-lessonL09').dataset.liRuntime!=='react-candidate','Flag OFF was hijacked');
  checks.push('Feature OFF keeps the complete existing native L09 screen and editing behavior');
  doc=await load(true);
  await wait(()=>doc.querySelector('#page-lessonL09')?.dataset.liRuntime==='react-candidate','React mounted in native shell');
  const page=doc.querySelector('#page-lessonL09'),react=doc.querySelector('#li-step16-l09-react-host');
  assert(react&&react.querySelector('.pilot [data-answer="0"]'),'React challenge not mounted');
  assert(doc.querySelector('#l09-challenge').hidden&&doc.querySelector('#l09-challenge').inert &&
    doc.querySelector('#l09-rubric').hidden&&doc.querySelector('#l09-rubric').inert,
    'Original challenge/rubric still interactive behind React');
  assert(!doc.querySelector('#l09-concept').hidden&&!doc.querySelector('#l09-guided').hidden &&
    !doc.querySelector('#l09-sources').hidden,'Native theory, guided practice or citations were hidden');
  checks.push('React replaces challenge/rubric only; original theory, guided practice and sources remain available');
  assert(doc.querySelector('.header .brand')&&doc.querySelector('.mobile-nav')&&doc.querySelector('#page-catalog'),
    'Original navigation or other screens removed');
  checks.push('Header, mobile navigation and all non-L09 Vanilla screens remain untouched');
  assert(react.querySelector('.pilot').dataset.storageKey===key,'React candidate used the real native key');
  assert(localStorage.getItem(nativeKey)===null,'Native learner record touched');
  checks.push('React candidate writes to an isolated experiment key; native learner key stays untouched');
  const t=react.querySelector('[data-answer="0"]');
  const d=Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLTextAreaElement.prototype,'value');
  d.set.call(t,'Synthetic experiment answer long enough to save locally');
  t.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));
  await wait(()=>JSON.parse(localStorage.getItem(key)||'null')?.draft?.[0]?.includes('Synthetic experiment'),'React autosave');
  assert(localStorage.getItem(nativeKey)===null,'React overwrote native attempt');
  checks.push('Real React textarea persists its draft, without touching existing native data');
  assert(react.querySelector('[data-action="submit"]')&&react.querySelector('[data-rubric-locked]'),
    'Candidate lost submission/rubric gate');
  assert(react.querySelector('[data-status]')?.getAttribute('role')==='status',
    'Candidate status is not announced');
  checks.push('Source-backed submit/rubric gate and accessible status survive native-shell mount');
  const css=frame.contentWindow.getComputedStyle(react.querySelector('[data-action="submit"]'));
  assert(parseFloat(css.minHeight)>=48,'React touch target below 48px');
  assert(react.querySelector('.pilot').getBoundingClientRect().width <= 395,'React overflow at 390px');
  checks.push('390px screen retains mobile touch targets and responsive content');
  doc=await load(true,820);
  await wait(()=>doc.querySelector('#page-lessonL09')?.dataset.liRuntime==='react-candidate','820px mount');
  assert(doc.querySelector('.pilot')&&doc.querySelector('.header'),'820px shell missing');
  checks.push('820px screen mounts React without losing Vanilla shell');
  frame.remove();localStorage.removeItem(key);
  result.textContent='LI_STEP16_L09_SHELL_PASS '+JSON.stringify({count:checks.length,checks,note:'localhost-only; local isolated key; no production deploy, cross-device sync, Google Auth or Safari pass'});
 }catch(e){
  frame?.remove();localStorage.removeItem(key);
  const d=frame?.contentDocument,win=frame?.contentWindow;
  const diagnostic={runtime:d?.querySelector('#page-lessonL09')?.dataset.liRuntime,
    hasLoader:!!d?.querySelector('script[src*="step16-react-router"]'),
    host:!!d?.getElementById('li-step16-l09-react-host'),
    fallback:d?.querySelector('#l09-challenge [role="status"]')?.textContent,
    jsAsset:await fetch('../../site/assets/step16-l09-island.js').then(x=>x.status).catch(()=>null),
    cssAsset:await fetch('../../site/assets/step16-l09-island.css').then(x=>x.status).catch(()=>null),
    route:win?.location.href};
  result.textContent='LI_STEP16_L09_SHELL_FAIL '+JSON.stringify({checks,error:e.stack||String(e),diagnostic});
 }
})();
</script></body></html>
