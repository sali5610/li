name: li. Scoped companion / practice QA

on:
  pull_request:
    branches: [main, integration/staging]
    paths:
      - 'site/index.html'
      - 'site/assets/checkin-*'
      - 'site/assets/spell-practice.*'
      - 'site/assets/app-language*.js'
      - 'site/assets/laoly-*'
      - 'tools/checkin_adaptation_regression.mjs'
      - 'tools/test_i18n_legacy.cjs'
      - 'tools/test_navigation.js'
      - 'tools/test_inquiry_react_actions.cjs'
      - '.github/workflows/li-companion-qa.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check adaptive study mode mapping and check-in actions
        run: node tools/checkin_adaptation_regression.mjs
      - name: Check the real 13-spell engine and lesson-context gates
        run: |
          node --check site/assets/spell-practice.js
          node tools/test_spell_direct_engine.cjs
      - name: Check VI/EN companion copy and quote coverage
        run: node tools/test_i18n_legacy.cjs
      - name: Check React backup and native navigation fallback
        run: node tools/test_navigation.js
      - name: Check canonical React Case writer and Notebook readback
        run: node tools/test_inquiry_react_actions.cjs
