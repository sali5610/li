name: Publish li. Design System (source in sali5610/li)

# This separate GitHub Pages repository contains NO copied Design System source.
# Every run fetches the source from the li. app repository.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: li-design-system-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - name: Checkout the ONE canonical DS source
        uses: actions/checkout@v4
        with:
          repository: sali5610/li
          # After PR #168 merges, update this single ref to main.
          ref: design-system/uxds35-single-studio-20261120
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared authored tokens
        working-directory: source
        run: python3 tools/generate_design_tokens.py --check
      - name: Compile canonical React components
        working-directory: source/design-system/react
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Build Design System website, not learner app
        working-directory: source
        run: |
          set -euo pipefail
          node tools/build-design-system-site.mjs
          node --check dist-design-system/studio.js
          test -s dist-design-system/index.html
          test -s dist-design-system/react-components.js
          test -s dist-design-system/assets/design-tokens.css
          test ! -e dist-design-system/staging-auth-gate.js
          test ! -e dist-design-system/lesson-l09-hifi.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist-design-system/
      - name: Publish only the independent Design System
        uses: actions/deploy-pages@v4
