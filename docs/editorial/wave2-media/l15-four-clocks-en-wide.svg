<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="626" viewBox="0 0 1096 626" role="img" aria-labelledby="title desc">
<title id="title">Four clocks for one Arrival — EN</title>
<desc id="desc">PLANNED: 10:00, Scheduled Arrival, Not confirmed arrival. ETA: 11:20, Estimated as of 09:00, Not confirmed arrival. ACTUAL: 11:45, Reported event time, Not receipt time. RECEIPT: 12:00, System receives report, Not truck arrival time. The truck may arrive before its report.</desc>
<rect width="1096" height="626" fill="#F7F6F1"/>
<rect x="38" y="30" width="125" height="32" rx="16" fill="#263A2E"/>
<text x="56" y="51" fill="#FFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">li. / L15-2-3</text>
<text x="38" y="120" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="bold">Four clocks for one Arrival</text>
<text x="38" y="153" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="17">Fictional · same day UTC+7 · not real data</text>
<g role="group" aria-label="PLANNED 10:00. Scheduled Arrival. Not confirmed arrival">
<rect x="38" y="185" width="246" height="277" rx="18" fill="#EAEFE9" stroke="#BAC4BB" stroke-width="1.4"/>
<text x="59" y="211" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">01 / 04</text>
<text x="59" y="243" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" letter-spacing="0.4">PLANNED</text>
<text x="59" y="336" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold">10:00</text>
<text x="59" y="390" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">Scheduled Arrival</text><text x="59" y="417" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">Not confirmed arrival</text></g>
<g role="group" aria-label="ETA 11:20. Estimated as of 09:00. Not confirmed arrival">
<rect x="302" y="185" width="246" height="277" rx="18" fill="#F0E9DC" stroke="#BAC4BB" stroke-width="1.4"/>
<text x="323" y="211" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">02 / 04</text>
<text x="323" y="243" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" letter-spacing="0.4">ETA</text>
<text x="323" y="336" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold">11:20</text>
<text x="323" y="390" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">Estimated as of 09:00</text><text x="323" y="417" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">Not confirmed arrival</text></g>
<g role="group" aria-label="ACTUAL 11:45. Reported event time. Not receipt time">
<rect x="566" y="185" width="246" height="277" rx="18" fill="#DDEBE4" stroke="#BAC4BB" stroke-width="1.4"/>
<text x="587" y="211" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">03 / 04</text>
<text x="587" y="243" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" letter-spacing="0.4">ACTUAL</text>
<text x="587" y="336" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold">11:45</text>
<text x="587" y="390" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">Reported event time</text><text x="587" y="417" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">Not receipt time</text></g>
<g role="group" aria-label="RECEIPT 12:00. System receives report. Not truck arrival time">
<rect x="830" y="185" width="246" height="277" rx="18" fill="#E9E8EE" stroke="#BAC4BB" stroke-width="1.4"/>
<text x="851" y="211" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">04 / 04</text>
<text x="851" y="243" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" letter-spacing="0.4">RECEIPT</text>
<text x="851" y="336" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold">12:00</text>
<text x="851" y="390" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">System receives report</text><text x="851" y="417" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="16">Not truck arrival time</text></g>
<line x1="38" x2="1058" y1="481" y2="481" stroke="#BAC4BB" stroke-width="1.5"/>
<text x="38" y="515" fill="#263A2E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold">The truck may arrive before its report.</text>
<text x="38" y="545" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="17">Prediction ≠ event evidence · Receipt ≠ Actual</text>
<text x="38" y="602" fill="#526357" font-family="Arial, Helvetica, sans-serif" font-size="13">Original diagram by li. · Fictional timestamps · Terminology reference: Oracle OTM</text>
</svg>