name: li. Focused rendered CSS smoke (no deploy)

# Broader visual/physical-device checks run only for affected releases.
on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/assets/*.css'
      - 'site/lessons/**'
      - 'design-system/tokens.json'
      - 'tools/render_contract_fixture.html'
      - '.github/workflows/li-render-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated design tokens
        run: python3 tools/generate_design_tokens.py --check
      - name: Check representative responsive geometry in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome" || { echo 'Chrome unavailable'; exit 1; }
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . > /tmp/li-render-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          # 320 minimum, 390 phone, 820 tablet, 1408 iPad landscape.
          for width in 320 390 820 1408; do
            url="http://127.0.0.1:8765/tools/render_contract_fixture.html?w=$width"
            result="$("$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1600,1100 --virtual-time-budget=12000 --dump-dom "$url" 2>/tmp/li-chrome-stderr.log || true)"
            if [[ "$result" != *'<pre id="result">LI_RENDER_PASS '* ]]; then
              echo "FAIL rendered CSS at $width CSS px"
              echo "$result" | grep -E 'LI_RENDER_(FAIL|PENDING)' | tail -1 | cut -c1-1800 || true
              tail -20 /tmp/li-chrome-stderr.log || true
              exit 1
            fi
            echo "PASS rendered CSS at $width CSS px"
          done
          echo 'PASS affected UI responsive smoke; not physical Safari or full regression'
