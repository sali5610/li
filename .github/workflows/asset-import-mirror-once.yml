name: One-shot authorized Li mirror character import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/asset-import-mirror-once.yml'
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Notion mirror illustration into repository
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib
          url="https://prod-files-secure.s3.us-west-2.amazonaws.com/1dfd3dff-63dd-44a0-93ec-65da8062ad64/6b4524ec-36af-49f4-b1c8-1bc659135d7a/lao_ly_10_suy_nghi_mirror.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=ASIAZI2LB466T7ALAPSK%2F20261117%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20261117T165755Z&X-Amz-Expires=300&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEB8aCXVzLXdlc3QtMiJGMEQCIALxu6aY%2Bn58F7bd3aWgZKFey4VwU%2F7mhRVUBW21ooYWAiAEGiY5Q3Cktbz76HU1J2EcqU8oNK3U4eNy1bbM3YRtKCqIBAjo%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F8BEAAaDDYzNzQyMzE4MzgwNSIM8QPQ6XNN3tWXf6NHKtwD%2BK024v1ThTeVk9dpO394BI%2BXP0GmST8cwdtYKIJG8laJlrDhffo46zvoRfnCPEoaMl0e9rl9WPJAkutT3mwba3R7SIIfc583oenktFQopGxkMvQRReZxMQ%2FXcuWpBsqCV9EdTwh1%2BSuLTtZyTGqeOIbUaaBs7Hip3UtiE4l3qI8%2FZKHhuC2g8XNAhjyX%2F%2BXAvMdPJucK8GaviRe3kbdbo3xc%2BfM5tag77kToxjt4jcZEOIhLh2cpTsdT7rgZnTD5YbHz9%2B%2B1BMBSeITgKjJ%2Fn9CkgOqYXWBfykpRVt1JDTU9IsPuPAG%2BIUV%2FYfNg39pSp%2BTv3LVCjHTLIfTOdBH%2BgeQCIxK7alkDftr13TsULkYJ4hMrytUe%2BwbO5xaWMFnEQWjAONirZaC6v9tm0NN49C1kJf7Akyc3Tikbttjy5xT4KnUHL0WtToZrXLFiCwEOCkLEijf03ueVcY5SjM5%2FY4mFkJME7v7VthUUdP81bNUh8HRm7BXY7gUiHn%2BrizelfIPrqHy%2FKGi%2B3V3dwhqzELDZd5EdNPcTSweJnkGd7O5lRivUD7KQNsOP4bzKSq%2FM0PjWAKHjjwaLoAMkQnGvHE%2FYs3HAfXSIlOcKYfbz%2FZvpcLahaSa0G%2Fk7n%2FswpN3x1wY6pgFIzXqC63xEHqAo65YNCo3lZB5fGXN8MM3seHtznLbaaBQr6MyNEuzVyWjtmdCR2VEsTuMtBSw7ny21%2B9Os0Eovlg0uhqlht1ozysunGeedU%2FxiED3z1CC1BwWxkwqQBkOHzNtcObpILKaf10ZTNMMBEcm0wSDAx4CKRoENba7SM4rSGx5imD%2BDnObyeIVRyP7U9Q9SAXHIvAvJ73rKYMR2%2BNm7Ezb2&X-Amz-Signature=1f2872c7906fee1bb93f2b3d2a33d3bf7d1c07989d4bd575167591f7b794a52c&X-Amz-SignedHeaders=host&x-amz-checksum-mode=ENABLED&x-id=GetObject"
          output=pathlib.Path("site/assets/laoly-mirror-suy-nghi.png")
          with urllib.request.urlopen(url, timeout=60) as res:
              data=res.read(15_000_000)
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise RuntimeError("Mirror art is not a valid PNG")
          width=int.from_bytes(data[16:20], "big")
          height=int.from_bytes(data[20:24], "big")
          if (width, height)!=(1024,1024) or len(data)<100000:
              raise RuntimeError(f"Unexpected mirror illustration: {(width,height)} bytes={len(data)}")
          output.write_bytes(data)
          print(f"MIRROR_ASSET_IMPORTED dimensions={width}x{height} bytes={len(data)}")
          PY
      - name: Save permanent local asset for zero-cost GitHub Pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/laoly-mirror-suy-nghi.png
          git commit -m "assets: store Lão Lý Trong gương illustration locally"
          git push origin HEAD:main
