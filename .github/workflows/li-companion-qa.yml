name: Validate li. companion changes
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/li-companion-qa.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static site and all companion plans
        run: python3 tools/validate_site.py
      - name: Check adaptive study mode mapping and check-in actions
        run: node tools/checkin_adaptation_regression.mjs
      - name: Parse the interactive Spellbook runtime
        run: node --check site/assets/spell-practice.js
      - name: Check authored VI/EN legacy UX copy and quote coverage
        run: node tools/test_i18n_legacy.cjs
