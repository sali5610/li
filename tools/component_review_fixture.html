<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>li. Component Review Browser Fixture</title></head>
<body><pre id="result">LI_SHOWCASE_PENDING</pre><iframe id="preview" src="../site/component-library-review.html" title="Component preview" style="border:0;width:100%;height:900px"></iframe>
<script>
"use strict";
const iframe=document.getElementById("preview"),result=document.getElementById("result");
const requestedWidth=Number(new URLSearchParams(location.search).get("w"));
if([320,390,820].includes(requestedWidth))iframe.style.width=requestedWidth+"px";
let ended=false;function finish(fail,checks){if(ended)return;ended=true;result.textContent=(fail?"LI_SHOWCASE_FAIL ":"LI_SHOWCASE_PASS ")+JSON.stringify(checks);}
iframe.addEventListener("load",()=>{
 setTimeout(()=>{
  const checks=[];
  try{
   const d=iframe.contentDocument,w=iframe.contentWindow;
   const check=(label,ok,detail)=>{checks.push({label,passed:!!ok,detail:detail||""});};
   const tokens=w.getComputedStyle(d.documentElement);
   check("Canonical generated paper token",tokens.getPropertyValue("--paper").trim().toUpperCase()==="#F3EBDC");
   check("Review pending G2",d.body.textContent.includes("Chờ Human PO duyệt component"));
   const cards=d.querySelectorAll(".ds-method-grid .ds-method");
   check("Original method grid preserves two approved tiles",cards.length===2);
   const g=d.querySelector(".ds-method-grid");
   const col=w.getComputedStyle(g).gridTemplateColumns.split(" ").filter(Boolean);
   check("Specimen grid two columns",col.length===2,col.join(" / "));
   const actual=d.querySelector("#ds-device iframe");
   check("Embedded app uses actual live Guide route",actual?.getAttribute("src")==="./index.html?page=guide");
   const controls=[...d.querySelectorAll("[data-width]")];
   check("Real device widths available",["320","375","390","402","600","820"].every(width=>controls.some(c=>c.dataset.width===width)));
   const two=controls.find(x=>x.dataset.width==="320");
   two.click();
   check("Responsive viewport button changes iframe width",d.getElementById("ds-device").style.width==="320px");
   check("Pressed state synchronized",two.getAttribute("aria-pressed")==="true");
   const radio=d.querySelectorAll('input[name="ds-physical"]');
   check("Check-in binary radio accurately mirrored",radio.length===2);
   const nav=[...d.querySelectorAll("[data-navspec]")];
   nav[1].click();
   check("Navigation selected state responds",nav[1].getAttribute("aria-current")==="page"&&!nav[0].hasAttribute("aria-current"));
   d.getElementById("action-demo").click();
   check("Specimen action feedback is truthful",d.getElementById("action-result").textContent.includes("không điều hướng"));
   check("Lucide icons resolved to SVG",d.querySelectorAll("#icons svg.lucide").length>=12);
   const seal=d.querySelector(".ds-mark img");
   check("Real approved seal SVG loads instead of font fallback",!!seal&&seal.complete&&seal.naturalWidth>0);

   const smallIcon=d.querySelector("#icons .ds-symbol-small");
   const navIcon=d.querySelector("#icons .ds-symbol-nav");
   check("Lucide size roles are 18px / 22px after SVG replacement",!!smallIcon&&!!navIcon&&w.getComputedStyle(smallIcon).width==="18px"&&w.getComputedStyle(navIcon).width==="22px",smallIcon?w.getComputedStyle(smallIcon).width+"/"+w.getComputedStyle(navIcon).width:"missing");
   check("Global icon semantic mapping: Tủ Riêng archive",!!d.querySelector('.ds-tabs [data-lucide="archive"],.ds-tabs svg.lucide'));
   check("Text-link variant and disabled state",d.querySelectorAll(".ds-link").length>=5&&!!d.querySelector(".ds-link[disabled]"));
   const light=d.querySelector(".ds-large.light"),warm=d.querySelector(".ds-large.warm");
   check("Both large-card ivory levels",!!light&&!!warm&&w.getComputedStyle(light).backgroundColor!==w.getComputedStyle(warm).backgroundColor);
   check("Subtle Home chat bubble anatomy",!!d.querySelector(".ds-home-bubble p")&&w.getComputedStyle(d.querySelector(".ds-home-bubble")).boxShadow==="none");
   const note=d.getElementById("ds-textarea"),noteStyle=w.getComputedStyle(note);
   check("Notebook textarea is canonical ruled-paper 32px variant",note.classList.contains("ds-notebook")&&noteStyle.backgroundImage.includes("linear-gradient")&&noteStyle.backgroundSize.includes("32px")&&noteStyle.lineHeight==="32px",noteStyle.backgroundSize+"; "+noteStyle.lineHeight);
   check("Notebook font mirrors actual UI body, not browser monospace default",noteStyle.fontFamily===w.getComputedStyle(d.body).fontFamily,noteStyle.fontFamily);
   const dark=d.querySelector(".ds-home-bubble.green"),lightBubble=d.querySelector(".ds-home-bubble:not(.green)");
   check("Two chat-bubble visual options, including Home forest green",!!dark&&!!lightBubble&&w.getComputedStyle(dark).backgroundColor!==w.getComputedStyle(lightBubble).backgroundColor&&w.getComputedStyle(dark).boxShadow!=="none");
   const art=[...d.querySelectorAll(".ds-image-grid .ds-image-card img")];
   check("Three published illustration cards, all valid images",art.length===3&&art.every(img=>img.complete&&img.naturalWidth>0&&img.alt.length>15),art.map(img=>img.src.split("/").pop()+":"+img.naturalWidth).join(", "));
   check("Crop vs contained illustrations are distinguishable",art.length===3&&w.getComputedStyle(d.querySelector(".ds-image-top img")).objectFit==="cover"&&w.getComputedStyle(d.querySelector(".ds-image-character img")).objectFit==="contain");
   const tap=w.getComputedStyle(d.querySelector(".ds-tabs button")).webkitTapHighlightColor;
   check("No rectangular iOS native button tap flash in review",tap==="rgba(0, 0, 0, 0)"||tap==="transparent",tap);
   check("Textarea specimen supports real input",!!d.getElementById("ds-textarea")&&!d.getElementById("ds-textarea").disabled);
   d.getElementById("ds-textarea").value="Một ý tưởng";
   d.getElementById("ds-textarea").dispatchEvent(new w.Event("input",{bubbles:true}));
   check("Textarea counter does not claim saved",d.getElementById("ds-textarea-counter").textContent.includes("chưa lưu"));
   const error=d.getElementById("ds-error");
   check("Input validation starts invalid",error.getAttribute("aria-invalid")==="true");
   error.value="Xin chào";
   error.dispatchEvent(new w.Event("input",{bubbles:true}));
   check("Input validation updates on user input",error.getAttribute("aria-invalid")==="false");
   const chips=[...d.querySelectorAll("[data-chip]")];
   chips[2].click();
   check("Filter chips change pressed state",chips[2].getAttribute("aria-pressed")==="true"&&chips[0].getAttribute("aria-pressed")==="false");
   check("4 bottom navigation variants",d.querySelectorAll(".ds-tabs button").length===4);
   const reviewChips=d.querySelector(".ds-chip"),radius=w.getComputedStyle(reviewChips).borderTopLeftRadius;
   check("Filter chips have fully rounded corners",radius==="999px",radius);
   const iconOnly=d.querySelector('[data-ds11-icon="bookmark"]');
   check("Transparent 48px icon-only button, no framed background",w.getComputedStyle(iconOnly).width==="48px"&&w.getComputedStyle(iconOnly).backgroundColor==="rgba(0, 0, 0, 0)");
   iconOnly.click();
   check("Bookmark example toggles aria-pressed",iconOnly.getAttribute("aria-pressed")==="true");
   const small=d.querySelector(".ds11-small-button");
   check("Small button variant has 40px default visual height",w.getComputedStyle(small).minHeight==="40px"||w.getComputedStyle(small).minHeight==="44px");
   const lang=d.getElementById("ds11-lang-switch");
   lang.click();check("Language switch updates aria-checked and visible copy",lang.getAttribute("aria-checked")==="true"&&d.getElementById("ds11-lang-caption").textContent.includes("English"));
   const trigger=d.getElementById("ds11-dropdown-trigger"),menu=d.getElementById("ds11-dropdown-menu");
   trigger.click();
   check("Dropdown menu opens with aria-expanded",!menu.hidden&&trigger.getAttribute("aria-expanded")==="true");
   const second=d.querySelectorAll("[data-ds11-option]")[1];second.click();
   check("Dropdown menu chooses value and closes",menu.hidden&&trigger.getAttribute("aria-expanded")==="false"&&trigger.textContent.includes("Tâm lý học"));
   d.querySelectorAll("[data-ds11-sidebar]")[2].click();
   check("Left sidebar selection updates title and current state",d.getElementById("ds11-sidebar-preview").textContent==="Tủ Riêng"&&d.querySelectorAll('[data-ds11-sidebar][aria-current="page"]').length===1);
   d.querySelectorAll("[data-ds11-list]")[1].click();
   check("List item selected state updates exclusively",d.querySelectorAll('[data-ds11-list][aria-current="true"]').length===1);
   const checkBox=d.querySelector('[data-ds11-check][value="Vấn đề"]');checkBox.click();
   check("Checkbox multi-select state and status",checkBox.checked&&d.getElementById("ds11-check-caption").textContent.includes("Vấn đề"));
   const radio2=d.querySelector('[name="ds11-radio"][value="Danh sách"]');radio2.click();
   check("Radio selection native single-choice",radio2.checked&&!d.querySelector('[name="ds11-radio"][value="Card"]').checked);
   const inputIcon=d.getElementById("ds11-icon-input");inputIcon.value="UX";inputIcon.dispatchEvent(new w.Event("input",{bubbles:true}));
   check("Text input with icon emits descriptive status",d.getElementById("ds11-search-caption").textContent.includes("UX"));
   const progress=d.getElementById("ds11-progress-demo"),pLabel=d.getElementById("ds11-progress-label");
   check("Progressbar starts determinate 3 of 6",progress.getAttribute("aria-valuenow")==="3"&&pLabel.textContent.includes("50%"));
   d.getElementById("ds11-progress-add").click();
   check("Progressbar updates width, aria and count after clicking",progress.getAttribute("aria-valuenow")==="4"&&pLabel.textContent.includes("67%"));
   d.getElementById("ds11-progress-reset").click();
   check("Progressbar resets to zero",progress.getAttribute("aria-valuenow")==="0"&&pLabel.textContent.includes("0%"));
   const unknown=d.querySelector(".ds11-progress-track.indeterminate");
   check("Indeterminate never invents a numeric progress value",!unknown.hasAttribute("aria-valuenow")&&!!unknown.getAttribute("aria-valuetext"));
   const compact=d.querySelector(".ds11-progress-track.compact");
   check("Compact progress variant present for list/card",!!compact&&compact.getAttribute("aria-valuenow")==="2");
   const calendar=d.getElementById("ds11-calendar"),chart=d.getElementById("ds11-chart");
   const today=new Date(),todayCount=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
   check("Calendar uses actual current month, not hard-coded November",calendar.querySelectorAll(".ds11-date").length===todayCount);
   const colors=["overload","recover","start","focus"].map(mode=>{const x=calendar.querySelector('.ds11-date[data-mode="'+mode+'"]');return x?w.getComputedStyle(x).backgroundColor:null;});
   check("Four rhythm modes have unique light-to-dark colors",colors.every(Boolean)&&new Set(colors).size===4,colors.join(" / "));
   check("Stacked bar shows exactly 7 days in the selected week",chart.querySelectorAll(".ds11-bar-cell").length===7);
   check("Stacked bar segments represent Bài/Vấn đề/Input",!!chart.querySelector(".ds11-bar-segment.lesson")&&!!chart.querySelector(".ds11-bar-segment.branch")&&!!chart.querySelector(".ds11-bar-segment.input"));
   calendar.querySelector('.ds11-date[data-day="1"]').click();
   d.getElementById("ds11-week-next").click();
   check("Seven-day paging updates range and keeps 7 bars",chart.querySelectorAll(".ds11-bar-cell").length===7&&d.getElementById("ds11-week-range").textContent.startsWith("8"));
   d.getElementById("ds11-month-next").click();
   const nextMonthCount=new Date(today.getFullYear(),today.getMonth()+2,0).getDate();
   check("Month navigation changes day count, avoids fake stored history",calendar.querySelectorAll(".ds11-date").length===nextMonthCount&&d.body.textContent.includes("DỮ LIỆU GIẢ LẬP"));
   const chartOverflow=chart.scrollWidth-chart.clientWidth;
   check("Stacked bar chart does not overflow its container",chartOverflow<=2,String(chartOverflow));

   /* UX-DS-12: verify new PO requirements in the rendered, interactive specimen. */
   const navHeight=parseFloat(w.getComputedStyle(d.querySelector(".ds-tabs button")).minHeight);
   check("Compact bottom navigation preserves >=48px touch target",navHeight>=48&&navHeight<=56,String(navHeight));
   const square=d.querySelector('.ds11-check-row input[type="checkbox"]');
   check("Checkbox painted as a sharp square",w.getComputedStyle(square).borderTopLeftRadius==="0px",w.getComputedStyle(square).borderTopLeftRadius);
   const fields=[d.getElementById("ds-query"),d.getElementById("ds-textarea"),d.getElementById("ds11-icon-input")];
   check("All enabled text/search/notebook surfaces are pure white",fields.every(el=>w.getComputedStyle(el).backgroundColor==="rgb(255, 255, 255)"),fields.map(el=>w.getComputedStyle(el).backgroundColor).join(" / "));
   check("Disabled input remains visually distinct",w.getComputedStyle(d.getElementById("ds-disabled")).backgroundColor!=="rgb(255, 255, 255)");
   check("Illustration frame has no paper-colored backing",w.getComputedStyle(d.querySelector(".ds-image-character .ds-image-frame.figure")).backgroundColor==="rgba(0, 0, 0, 0)");
   const horizontals=[...d.querySelectorAll("[data-ds12-horizontal-card]")];
   check("Four distinct horizontal card types exist",horizontals.length===4&&
      !!horizontals[0].classList.contains("ds12-no-media")&&
      !!horizontals[1].querySelector("img")&&
      !!horizontals[2].querySelector("img")&&
      !!horizontals[3].querySelector("svg.lucide"));
   d.querySelector('[data-ds12-card-mode="secondary"]').click();
   check("All horizontal secondary variants are bordered without shadow",
      horizontals.every(el=>el.classList.contains("ds12-variant-secondary")&&w.getComputedStyle(el).boxShadow==="none"&&
      w.getComputedStyle(el).borderTopStyle==="solid"));
   d.querySelector('[data-ds12-card-mode="dark"]').click();
   check("All horizontal dark variants use forest surface",
      horizontals.every(el=>el.classList.contains("ds12-variant-dark")&&
      w.getComputedStyle(el).backgroundColor===w.getComputedStyle(d.querySelector(".ds-large.ds12-variant-dark")).backgroundColor));
   check("Category tag chips are static labels, not filter buttons",
      d.querySelectorAll(".ds12-tag-row .ds12-tag").length===4&&
      [...d.querySelectorAll(".ds12-tag-row .ds12-tag")].every(x=>x.tagName==="SPAN"&&!x.hasAttribute("aria-pressed")));
   d.getElementById("ds11-month-today").click();
   const dayToday=calendar.querySelector('.ds11-date[data-today="true"]');
   check("Calendar marks real today and selects it on reset",
      !!dayToday&&dayToday.dataset.day===String(today.getDate())&&dayToday.getAttribute("aria-pressed")==="true"&&
      w.getComputedStyle(dayToday,"::after").borderTopWidth==="2px");
   check("Chart highlights today separately from selected state",
      !!chart.querySelector('.ds11-bar-cell[data-today="true"]')&&
      chart.querySelector('.ds11-bar-cell[data-today="true"]').getAttribute("aria-pressed")==="true");
   d.getElementById("ds11-month-next").click();
   check("Travel to another month hides today marker",!calendar.querySelector('.ds11-date[data-today="true"]'));
   d.getElementById("ds11-week-today").click();
   check("Chart's Today action restores real today and matching calendar",
      !!calendar.querySelector('.ds11-date[data-today="true"][data-selected="true"]')&&
      !!chart.querySelector('.ds11-bar-cell[data-today="true"]'));

   if(w.innerWidth<=700){
     const tracks=element=>w.getComputedStyle(element).gridTemplateColumns.trim().split(/\s+/).length;
     check("Mobile illustrated cards stack into one column",tracks(d.querySelector(".ds-image-grid"))===1);
     check("Mobile light/green bubble options stack into one column",tracks(d.querySelector(".ds-bubble-options"))===1);
   }
   const overflow=d.documentElement.scrollWidth-w.innerWidth;
   check("Review page itself has no horizontal overflow",overflow<=3,String(overflow));
  }catch(e){checks.push({label:"Runtime evaluation",passed:false,detail:e.stack||e.message});}
  finish(checks.some(c=>!c.passed),checks);
 },800);
});
setTimeout(()=>{if(!ended)finish(true,[{label:"Timed out",passed:false}]);},7000);
</script></body></html>
