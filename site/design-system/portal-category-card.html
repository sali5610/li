<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Category Card — li.</title><link rel="stylesheet" href="./assets/design-tokens.css"><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f1ea;color:#263d2d;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto}small{color:#6e765b;font-weight:700;letter-spacing:.07em}h1{font:600 clamp(28px,5vw,48px) Georgia,serif;margin:20px 0}p{line-height:1.5}.demo{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:clamp(12px,3vw,30px);align-items:center;padding:24px 0;border-bottom:1px solid #b4b6aa}.art{position:relative;width:100%;aspect-ratio:4/5;isolation:isolate}.interior{position:absolute;inset:16% 16% 7%;background:#d9d8cd;border-radius:48% 48% 0 0;overflow:hidden}.interior img{width:100%;height:100%;object-fit:cover}.arch{position:absolute;inset:0;z-index:1;border:clamp(8px,2vw,17px) solid #846e50;border-bottom-width:clamp(12px,3vw,25px);border-radius:49% 49% 0 0;pointer-events:none}.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none}.eyebrow{font-weight:750;letter-spacing:.13em;font-size:clamp(11px,2vw,15px)}h2{font:600 clamp(24px,5vw,44px) Georgia,serif;margin:12px 0}.detail{font-size:clamp(14px,2.6vw,20px)}button{margin-top:22px;border:1px solid #263d2d;background:#f3f1ea;color:#263d2d;box-shadow:5px 5px #846e50;padding:12px 18px;font-weight:700;font-size:clamp(13px,2vw,18px);min-height:44px}.note{font-size:13px;color:#6d6b62;margin-top:20px}.arch[data-loaded=true]{display:none}@media(max-width:430px){body{padding:14px}.demo{padding:14px 0}button{margin-top:8px;padding:9px 12px}}
</style></head><body><main><small>UX-DS-35 / PARITY DRAFT</small><h1>Portal Category Card</h1><p>7 portal variations · illustration placeholder</p><article class="demo"><div class="art"><div class="interior" aria-label="Illustration placeholder"><img id="illustration" hidden alt=""></div><span id="arch" class="arch"></span><img id="overlay" class="overlay" alt="" hidden></div><div><span class="eyebrow" id="eyebrow">NHÓM NGÀNH</span><h2 id="title">Ngôn ngữ</h2><p class="detail" id="detail">2 chuyên ngành</p><button type="button" id="action">Khám phá →</button></div></article><p class="note" id="note">7 cổng WebP thật · minh hoạ để trống · chọn Portal 01–07 ở Variant.</p></main><script>
const q=new URLSearchParams(location.search),v=Math.max(1,Math.min(7,parseInt((q.get('variant')||'01').replace(/[^0-9]/g,''),10)||1));const en=q.get('lang')==='en';if(en){document.getElementById('eyebrow').textContent='DOMAIN GROUP';document.getElementById('title').textContent='Languages';document.getElementById('detail').textContent='2 fields';document.getElementById('action').textContent='Explore →';}
const overlay=document.getElementById('overlay');overlay.onload=()=>{overlay.hidden=false;document.getElementById('arch').dataset.loaded='true';document.getElementById('note').textContent='Portal '+String(v).padStart(2,'0');};overlay.onerror=()=>{overlay.hidden=true};overlay.src='../assets/portals/cong-moi-'+String(v).padStart(2,'0')+'.webp';
</script></body></html>
