<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>li. bilingual runtime journey fixture</title><style>
html,body{margin:0;padding:0;font:12px/1.5 monospace;background:#f1f0e9}
iframe{display:block;border:0;width:var(--width,390px);height:880px}
#result{white-space:pre-wrap;margin:12px;max-width:100%;overflow-wrap:anywhere}
</style><script>document.documentElement.style.setProperty("--width",(Number(new URLSearchParams(location.search).get("w"))||390)+"px");</script>
</head><body><iframe id="app" src="../site/index.html" title="li. actual runtime"></iframe>
<pre id="result">LI_I18N_PENDING</pre>
<script>
"use strict";
(()=>{
 const iframe=document.getElementById("app"),out=document.getElementById("result");
 let done=false;const checks=[],audit=[];
 const record=(name,pass,detail="")=>checks.push({name,pass:!!pass,detail:String(detail).slice(0,300)});
 const settle=()=>new Promise(resolve=>setTimeout(resolve,75));
 const label=el=>el?.textContent?.replace(/\s+/g," ").trim()||"";
 const pass=()=>checks.every(x=>x.pass);
 const finish=()=>{
  if(done)return;done=true;
  const data={width:iframe.contentWindow?.innerWidth,passed:checks.filter(x=>x.pass).length,total:checks.length,
   failures:checks.filter(x=>!x.pass),audit};
  out.textContent=(pass()?"LI_I18N_PASS ":"LI_I18N_FAIL ")+JSON.stringify(data);
 };
 iframe.addEventListener("load",async()=>{
  try{
   const w=iframe.contentWindow,d=iframe.contentDocument;
   const by=id=>d.getElementById(id);
   const current=()=>d.querySelector("section.page.active");
   const change=async lng=>{w.liLanguage.set(lng);await settle();};
   const route=async page=>{w.navigate(page,{focus:false,syncUrl:false});await settle();return current();};
   record("Global locale runtime",!!w.liLanguage&&typeof w.navigate==="function");
   await change("en");
   record("English root language + title",d.documentElement.lang==="en"&&d.title.includes("Library of Knowledge"),d.title);
   record("English keyboard drag instruction",by("laoly-fab")?.getAttribute("aria-description")?.startsWith("Drag to move Elder Li"),by("laoly-fab")?.getAttribute("aria-description"));
   record("Note detail empty title translates",label(by("li-note-detail-title"))==="Note details",label(by("li-note-detail-title")));
   // The companion is a product character, not an untranslated proper-name
   // exception. English labels, dialogue affordances and a11y must say Elder Li.
   record("English mentor modal name",label(by("buddy-title"))==="Elder Li",label(by("buddy-title")));
   record("English mentor floating control",/Elder Li/.test(by("laoly-fab")?.getAttribute("title")||"")&&/Elder Li/.test(by("laoly-fab")?.getAttribute("aria-label")||""),[by("laoly-fab")?.getAttribute("title"),by("laoly-fab")?.getAttribute("aria-label")].join(" | "));
   record("English mentor settings heading",label(d.querySelector("#page-settings .settings-buddy-heading h2"))==="Elder Li",label(d.querySelector("#page-settings .settings-buddy-heading h2")));
   record("English mentor dialogue accessibility",by("buddy-scroll")?.getAttribute("aria-label")==="Conversation with Elder Li",by("buddy-scroll")?.getAttribute("aria-label"));
   record("English mentor intro accessibility",by("page-home")?.querySelector(".hero-dialogue")?.getAttribute("aria-label")?.startsWith("Elder Li explains"),by("page-home")?.querySelector(".hero-dialogue")?.getAttribute("aria-label"));
   record("English mentor guide illustration alt",d.querySelector("#page-guide .guide-mentor-illustration")?.getAttribute("alt")==="Elder Li, half asleep",d.querySelector("#page-guide .guide-mentor-illustration")?.getAttribute("alt"));
   record("English mentor interactions",["buddy-question","buddy-challenge","buddy-forget"].every(id=>label(by(id)).includes("Elder Li")),["buddy-question","buddy-challenge","buddy-forget"].map(id=>label(by(id))).join(" | "));

   const expectations={
    home:["Mọi câu hỏi","Every question"],
    catalog:["Tàng Thư","Library"],
    guide:["Sổ Tay Thần Chú","The Spellbook"],
    library:["Tủ Riêng","My Shelf"],
    resume:["Quay lại","Continue"],
    collection:["Bộ sưu tập","Collection"],
    dashboard:["Nhật Ký","Daily Journal"],
    settings:["Cài đặt","Settings"],
    search:["Tra Cứu","Search"],
    capture:["Nhặt ý","Capture an idea"],
    research:["Khảo Chứng","Investigate"],
    case:["Phản Chứng","Test a claim"]
   };
   for(const [page,labels] of Object.entries(expectations)){
    const el=await route(page);
    const heading=label(el?.querySelector("h1"));
    // Some pages use the first editorial title in addition to an in-scene headline.
    const expected=labels[1],old=labels[0];
    record(page+" EN heading",heading.includes(expected),heading+" | expected "+expected);
    if(page==="guide")record("Guide count fully English",label(by("method-count")).startsWith("Showing ")&&!label(by("method-count")).includes("Hiển thị"),label(by("method-count")));
    if(page==="dashboard")record("Journal day labels read in English",d.querySelector('#li-diary-calendar button')?.getAttribute("aria-label")?.includes("no journal entry"),d.querySelector('#li-diary-calendar button')?.getAttribute("aria-label"));
    if(page==="settings")record("Lão Lý preview matches locale",label(by("buddy-preview-warm")).includes("take your time. The books can wait."),label(by("buddy-preview-warm")));
    if(page==="capture")record("Capture placeholder localized",by("capture-note")?.getAttribute("placeholder")==="I just came across…",by("capture-note")?.getAttribute("placeholder"));
    if(page==="case")record("Case editor placeholder localized",by("case-revision")?.getAttribute("placeholder")?.startsWith("Example:"),by("case-revision")?.getAttribute("placeholder"));
    if(page==="research")record("Research branching localized",label(d.querySelector('#page-research [data-branch]')).includes("Who was asked?"),label(d.querySelector('#page-research [data-branch]')));

    const residuals=[...el?.querySelectorAll("button,[aria-label],input,textarea,h1,h2,h3,p,.kicker")||[]]
      .filter(x=>x.getClientRects().length>0)
      .map(x=>({tag:x.tagName,text:label(x).slice(0,90),aria:x.getAttribute("aria-label")||"",placeholder:x.getAttribute("placeholder")||""}))
      .filter(x=>/[À-ỹ]/u.test(x.text+" "+x.aria+" "+x.placeholder))
      .slice(0,18);
    const over=d.documentElement.scrollWidth-w.innerWidth;
    audit.push({route:page,old,expected,overflow:over,residuals});
    record(page+" horizontal overflow",over<=4,over+"px");
   }
   // All 13 spell identities are distinct from their unchanged academic methods.
   await route("guide");
   const spells=[
    ["T01","Invocation of Recall","Retrieval Practice / Active Recall"],
    ["T02","Seal of Returning Memory","Spaced Repetition / Distributed Practice"],
    ["T13","Palace of Hidden Paths","Method of Loci / Memory Palace"],
    ["T03","The Vanishing Guidelight","Worked Examples & Guidance Fading"],
    ["T04","Lantern of Inner Insight","Guided Self-Explanation"],
    ["T05","Rite of Root-Seeking","Elaborative Interrogation"],
    ["T06","Mirror of Twin Forms","Compare–Contrast / Interleaved Discrimination"],
    ["T07","The Premise Ward","Logical Inference & Premise Checking"],
    ["T08","Mirror of Rebuttals","Argument Mapping & Counterevidence"],
    ["T09","The Source-Seer's Lens","Source Criticism & Evidence Appraisal"],
    ["T10","Unbinding the Boundaries","Problem Decomposition & Boundary Tests"],
    ["T11","Compass of Discernment","Method Fit & Metacognitive Awareness"],
    ["T12","Thread of Returning Focus","Meaningful Focus & Attention Re-entry"]
   ];
   const schools=["Memorycraft","Insightcraft","Reasoncraft","Unbinding Arts","Mindkeeping"];
   record("Five English magical schools",schools.every(name=>[...d.querySelectorAll("#method-filters .filter")].some(el=>label(el)===name)),[...d.querySelectorAll("#method-filters .filter")].map(label).join(" / "));
   const searchSpell=by("method-search");
   for(const [id,name,academic] of spells){
    searchSpell.value=name;
    searchSpell.dispatchEvent(new w.Event("input",{bubbles:true}));
    await settle();
    const cards=[...d.querySelectorAll("#method-cards .method-card")];
    const card=cards.find(x=>x.dataset.method===id);
    record(id+" English spell searchable",cards.length===1&&!!card, String(cards.length)+" "+cards.map(x=>x.dataset.method).join(","));
    record(id+" authored fantasy name + academic counterpart",!!card&&label(card.querySelector("h3"))===name&&label(card.querySelector(".original"))===academic,(card?label(card.querySelector("h3"))+" / "+label(card.querySelector(".original")):"missing"));
    if(card){
     card.click();await settle();
     record(id+" detail bilingual title and school",label(by("detail-title"))===name&&label(by("detail-id")).includes("SPELL NOTES /")&&!/[À-ỹ]/u.test(label(by("detail-id"))),label(by("detail-title"))+" / "+label(by("detail-id")));
     record(id+" detail academic identity unchanged",label(by("detail-original"))===academic,label(by("detail-original")));
     record(id+" detail fits viewport",d.documentElement.scrollWidth-w.innerWidth<=4,d.documentElement.scrollWidth-w.innerWidth+"px");
     await route("guide");
    }
   }
   searchSpell.value="Triệu Ức";
   searchSpell.dispatchEvent(new w.Event("input",{bubbles:true}));await settle();
   record("Vietnamese spell name still searchable in English mode",d.querySelector("#method-cards .method-card")?.dataset.method==="T01");
   await change("vi");
   record("VI spell name restored",label(d.querySelector("#method-cards .method-card h3"))==="Triệu Ức Chân Ngôn",label(d.querySelector("#method-cards .method-card h3")));
   record("VI spell school restored",[...d.querySelectorAll("#method-filters .filter")].some(el=>label(el)==="Ký Ức Thuật"));
   await change("en");
   record("EN spell name restored on language round-trip",label(d.querySelector("#method-cards .method-card h3"))==="Invocation of Recall",label(d.querySelector("#method-cards .method-card h3")));
   searchSpell.value="";
   searchSpell.dispatchEvent(new w.Event("input",{bubbles:true}));await settle();
   // Secondary audit: actual mentor replies must use the same translated spells
   // and the same English search semantics as the Guide, not an old VI-only index.
   await route("guide");
   searchSpell.value="Mirror of Rebuttals";
   searchSpell.dispatchEvent(new w.Event("input",{bubbles:true}));await settle();
   record("Mentor keyword has an English spell match",d.querySelector("#method-cards .method-card")?.dataset.method==="T08");
   w.openLaoLy(by("laoly-fab"));await settle();
   const third=by("buddy-forget");
   record("Mentor overlay opened",by("buddy-modal")?.classList.contains("open"));
   third?.click();await settle();
   const mentorResult=label(by("buddy-text"));
   record("Mentor search count localized",mentorResult.includes("1 spell matches")&&!mentorResult.includes("Có 1"),mentorResult);
   w.closeModal("buddy-modal");
   const guideCard=d.querySelector("#method-cards .method-card");
   guideCard?.click();await settle();
   w.openLaoLy(by("laoly-fab"));await settle();
   const mentorDetail=label(by("buddy-text"));
   record("Mentor mentions EN spell in details",mentorDetail.includes("Mirror of Rebuttals")&&!mentorDetail.includes("Luận Ảnh Phản Chiếu"),mentorDetail);
   w.closeModal("buddy-modal");
   // One representative multi-clause practice reply, including language round-trip.
   w.showMethod("T06");await settle();
   by("spell-tab-practice")?.click();await settle();
   const choosePractice=(name,value)=>{
    const el=d.querySelector('input[name="sp-'+name+'"][value="'+value+'"]');
    if(el){el.checked=true;el.dispatchEvent(new w.Event("change",{bubbles:true}));}
   };
   choosePractice("case1","0");choosePractice("case2","1");
   const written=by("sp-reason");
   if(written)written.value="Selection and sampling variation differ";
   d.querySelector('#spell-practice-panel [data-spell-action="check"]')?.click();await settle();
   const practiceFeedback=()=>label(d.querySelector("#spell-practice-panel .spell-feedback"));
   record("English multi-clause spell feedback",practiceFeedback().includes("Both cases are classified correctly.")&&!practiceFeedback().includes("Hai phân loại đúng."),practiceFeedback().slice(0,300));
   await change("vi");
   record("Spell feedback returns to original VI",practiceFeedback().includes("Hai phân loại đúng."),practiceFeedback().slice(0,220));
   await change("en");
   record("Spell feedback returns to EN without losing answer",practiceFeedback().includes("Both cases are classified correctly.")&&by("sp-reason")?.value==="Selection and sampling variation differ",practiceFeedback().slice(0,220));
   // Library metadata and bookmark accessibility labels are outside static i18n.
   await route("resume");
   w.liLibraryShelf?.trackLesson("lessonL09");
   w.liLibraryShelf?.renderResume();await settle();
   const savedProgress=label(d.querySelector("#li-lesson-history .library-list-copy p"));
   record("Recent lesson metadata fully EN",savedProgress.includes("Recently opened")&&savedProgress.includes("Opened")&&!savedProgress.includes("Đã mở"),savedProgress);
   const book=d.querySelector('#li-lesson-history [data-li-bookmark-kind="lesson"]');
   record("Bookmark ARIA fully EN",/^(Bookmark lesson|Remove bookmark for lesson)/.test(book?.getAttribute("aria-label")||""),book?.getAttribute("aria-label"));
   await route("capture");
   const inputNote=by("capture-note");
   if(inputNote){
    inputNote.value="Ý tưởng tự viết: đừng dịch nội dung của tui";
    by("save-capture-note")?.click();await settle();
    const collected=d.querySelector("#li-collection-list .library-collection-entry");
    const noteDate=label(collected?.querySelector("p.small"));
    const noteBody=label(collected?.querySelector(".library-entry-body"));
    record("Collection saved date EN",noteDate.startsWith("Saved ")&&!noteDate.includes("Lưu ngày"),noteDate);
    record("Personal collected note untouched",noteBody==="Ý tưởng tự viết: đừng dịch nội dung của tui",noteBody);
   }

   // Regression for the exact iPhone captures: deeply nested course statuses
   // and T01's assembled practice kicker previously escaped global translation.
   await route("catalog");
   const target=(()=>{
    for(const group of w.LI_CATALOG_DATA||[])
     for(const field of group.fields||[])
      for(const course of field.courses||[])
       if(course.lessons?.some(lesson=>lesson.id==="L03-1-2"))return {group,field,course};
    return null;
   })();
   record("L03 course reachable in actual catalog dataset",!!target);
   if(target){
    const clickCatalog=async(kind,value)=>{
     const button=d.querySelector('#page-catalog [data-catalog-kind="'+kind+'"][data-catalog-value="'+value+'"]');
     if(!button)return false;
     button.click();await settle();return true;
    };
    record("Catalog nested group path",await clickCatalog("open-group",target.group.id));
    record("Catalog nested field path",await clickCatalog("open-field",target.field.id));
    w.scrollTo(0,500);
    record("Catalog course path",await clickCatalog("open-course",target.course.id));
    const courseMeta=()=>[...d.querySelectorAll("#page-catalog .catalog-lesson-card .catalog-lesson-desc .small")].map(label);
    record("iPhone course published and outline statuses fully EN",
     courseMeta().length===target.course.lessons.length &&
     courseMeta().some(x=>x.includes("Published")) &&
     courseMeta().some(x=>x.includes("Outline · not published")) &&
     !courseMeta().some(x=>/Đã phát hành|Đề cương|chưa phát hành/.test(x)),courseMeta().join(" | "));
    record("English dynamic course eyebrow",label(d.querySelector("#page-catalog .section-shell > .kicker")).startsWith("COURSE ·"),label(d.querySelector("#page-catalog .section-shell > .kicker")));
    const title=d.querySelector("#page-catalog .catalog-progress h2"),header=d.querySelector(".header");
    record("Deep catalog navigation resets inherited scroll",w.scrollY<=2,String(w.scrollY));
    record("Course progress not clipped by sticky header",!!title&&title.getBoundingClientRect().top>=header.getBoundingClientRect().bottom-2,
     title?.getBoundingClientRect().top+" / "+header?.getBoundingClientRect().bottom);
    record("Deep catalog no horizontal overflow",d.documentElement.scrollWidth-w.innerWidth<=4,String(d.documentElement.scrollWidth-w.innerWidth));
    await change("vi");
    record("VI course statuses round-trip",courseMeta().some(x=>x.includes("Đã phát hành"))&&courseMeta().some(x=>x.includes("Đề cương · chưa phát hành")),courseMeta().join(" | "));
    await change("en");
    record("EN course statuses round-trip",courseMeta().every(x=>!/[À-ỹ]/u.test(x))&&courseMeta().some(x=>x.includes("Published")),courseMeta().join(" | "));
    const outline=target.course.lessons.find(x=>!x.published);
    if(outline){
     record("Unpublished lesson opens",await clickCatalog("open-lesson",outline.id));
     record("Unpublished lesson eyebrow EN",label(d.querySelector("#page-catalog .section-shell > .kicker")).startsWith("LESSON ·"),label(d.querySelector("#page-catalog .section-shell > .kicker")));
    }
   }
   await route("guide");
   for(const id of w.LiSpellPractice.methods){
    w.showMethod(id);
    by("spell-tab-practice")?.click();await settle();
    const title=label(d.querySelector("#page-guideDetail .spell-activity-head .kicker"));
    record(id+" practice kicker fully EN",title===id+" · TRY THE SPELL",title);
    const practiceBody=label(d.querySelector("#page-guideDetail .spell-practice-root"));
    const residue=[...new Set((practiceBody.match(/[À-ỹ][^.!?\n]{0,55}/gu)||[]))].slice(0,6);
    record(id+" practice panel free of Vietnamese copy",residue.length===0,residue.join(" | "));
   }
   w.showMethod("T01");
   by("spell-tab-practice")?.click();await settle();
   const practiceKicker=()=>label(d.querySelector("#page-guideDetail .spell-activity-head .kicker"));
   await change("vi");
   record("T01 practice label restored to VI",practiceKicker()==="T01 · THỬ THI TRIỂN",practiceKicker());
   await change("en");
   record("T01 practice label restored to EN",practiceKicker()==="T01 · TRY THE SPELL",practiceKicker());
   const fab=by("laoly-fab"),practiceTab=by("spell-tab-practice");
   const overlaps=(r,t)=>r.left<t.right&&r.right>t.left&&r.top<t.bottom&&r.bottom>t.top;
   const fr=fab.getBoundingClientRect(),tr=practiceTab.getBoundingClientRect();
   const toY=tr.top+(tr.height-fr.height)/2;
   const delta=toY-fr.top;
   const step=delta<0?"ArrowUp":"ArrowDown";
   for(let n=0;n<Math.min(50,Math.ceil(Math.abs(delta)/16));n++)
    fab.dispatchEvent(new w.KeyboardEvent("keydown",{key:step,bubbles:true}));
   w.liCompanionDrag?.place?.();await settle();
   record("Saved companion position dodges Spellbook tab",
    !overlaps(fab.getBoundingClientRect(),practiceTab.getBoundingClientRect()),
    "fab:"+fab.getBoundingClientRect().top+" tab:"+practiceTab.getBoundingClientRect().top);
   w.liCompanionDrag?.reset?.();
   await route("catalog");
   const host=d.querySelector("#page-catalog .section-shell");
   const step=async kind=>{
    const button=host.querySelector('button[data-catalog-kind="'+kind+'"]');
    if(!button)return false;
    button.click();await settle();return true;
   };
   record("Catalog root group cards",host.querySelectorAll(".catalog-card").length===8);
   record("Catalog group drill",await step("open-group"),label(host.querySelector("h1")));
   record("Catalog group title in English",!label(host.querySelector("h1")).includes("Công nghệ"),label(host.querySelector("h1")));
   record("Catalog field drill",await step("open-field"));
   record("Catalog field drill",await step("open-course"));
   const progress=label(host.querySelector(".catalog-progress"));
   record("Catalog progress labels English",!progress.includes("bài đã hoàn thành")&&!progress.includes("bài đã phát hành"),progress.slice(0,160));
   record("Catalog lesson drill",await step("open-lesson"));
   const unpublished=label(host.querySelector(".catalog-draft-content"));
   record("Unpublished course content bilingual",!unpublished.includes("Chưa có chương")&&!unpublished.includes("Nội dung đang"),unpublished.slice(0,170));
   await route("home");
   by("checkin")?.click();await settle();
   const dialog=by("checkin-modal");
   record("English Check-in dialog",dialog?.classList.contains("open")&&label(dialog).includes("How are you feeling physically today?"),label(dialog).slice(0,250));
   record("Check-in dialog horizontal fit",!dialog||dialog.querySelector(".dialog")?.getBoundingClientRect().right<=w.innerWidth+1);
   w.closeModal?.("checkin-modal");
   await route("settings");
   record("Global language setting controls",d.querySelectorAll("[data-li-app-locale]").length===2);
   await change("vi");
   record("Vietnamese mentor name restored",label(by("buddy-title"))==="Lão Lý"&&by("laoly-fab")?.getAttribute("aria-label")?.includes("Lão Lý"),label(by("buddy-title"))+" | "+by("laoly-fab")?.getAttribute("aria-label"));
   record("Vietnamese round-trip title",d.documentElement.lang==="vi"&&d.title.includes("Thư viện tri thức"),d.title);
   record("Vietnamese drag instruction restored",by("laoly-fab")?.getAttribute("aria-description")?.startsWith("Kéo để di chuyển"),by("laoly-fab")?.getAttribute("aria-description"));
   await route("resume");
   record("Continue heading returns to Vietnamese",label(current()?.querySelector("h1"))==="Quay lại",label(current()?.querySelector("h1")));
   await change("en");
   record("English mentor name returns",label(by("buddy-title"))==="Elder Li"&&by("laoly-fab")?.getAttribute("aria-label")?.includes("Elder Li"),label(by("buddy-title"))+" | "+by("laoly-fab")?.getAttribute("aria-label"));
   record("Continue heading returns to English",label(current()?.querySelector("h1"))==="Continue",label(current()?.querySelector("h1")));

   await route("capture");
   const note=by("capture-note");
   if(note){note.value="Đã lưu một ý trong sổ. Nội dung của tui!";await change("vi");await change("en");
    record("Learner-authored textarea remains unchanged",note.value==="Đã lưu một ý trong sổ. Nội dung của tui!",note.value);}
   const input=d.getElementById("global-search");
   await route("search");
   if(input){input.value="Bút Ký của riêng tui";await change("en");record("Search input remains untouched",input.value==="Bút Ký của riêng tui",input.value);}
   record("Switching VI↔EN retains app setting",w.localStorage.getItem("li.app.locale.v1")==="en");
  }catch(error){record("Fixture runtime",false,error.stack||error.message);}
  finish();
 });
 setTimeout(()=>{if(!done){record("Fixture timeout",false,"15s");finish();}},15000);
})();
</script></body></html>
