name: li. ontology staging static build (no deploy)
on:
  push:
    branches:
      - preview/ontology-search-20261120
    paths:
      - .github/workflows/li-ontology-staging-build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact ONT-04 Search + Graph + Lao Ly browser preview
        working-directory: tools/ont04b-react-search-island
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run build
      - name: Commit only generated static preview to this isolated staging branch
        run: |
          set -euo pipefail
          git config user.name "li-staging-bot"
          git config user.email "101487249+sali5610@users.noreply.github.com"
          git add -f tools/ont04b-react-search-island/dist/index.html tools/ont04b-react-search-island/dist/assets/
          git diff --cached --quiet && exit 0
          git commit -m "build(staging): compiled ONT-04 preview, no production release"
          git push origin "HEAD:preview/ontology-search-20261120"
