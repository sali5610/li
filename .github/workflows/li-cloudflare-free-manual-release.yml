name: Release li. to Cloudflare Pages Free — MANUAL ONLY

# IMPORTANT: Manual dispatch is the ONLY deploy trigger. PR gate builds a candidate locally but NEVER deploys.
# Auth-only pins the exact live PWA source plus the offline bootstrap/cache fix; AI retains its independent reviewed SHA,
# without merging all staging changes into main. Never dispatch until preflight.
on:
  # Focused PR gate builds the pinned Auth-only artifact; it never deploys.
  pull_request:
    paths:
      - '.github/workflows/li-cloudflare-free-manual-release.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Enter the mode-specific confirmation (static, AI, or Auth-only)."
        required: true
        type: string
      ai_mode:
        description: "AI Free mode: blocked until approved D1/AI bindings and G4 gate."
        required: false
        type: boolean
        default: false
      auth_only_mode:
        description: "First-party iPhone PWA Auth only; no AI/D1 (requires separate approval)"
        required: false
        type: boolean
        default: false
      push_minute_mode:
        description: "Include ONE preflight-guarded existing Free Push Worker update: Cron 1 minute, send 1 minute early; keep VAPID/D1"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: li-cloudflare-pages-free-production
  cancel-in-progress: false

jobs:
  auth_candidate_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout pinned, already reviewed staging source (no secrets)
        uses: actions/checkout@v4
        with:
          ref: 0b5c434588685783299ca413860492a2ca4d4235
          persist-credentials: false
      - name: Verify immutable source and validate app shell
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0b5c434588685783299ca413860492a2ca4d4235"
          python3 tools/validate_site.py
          python3 tools/generate_design_tokens.py --check
          python3 tools/validate_design_system.py
          python3 tools/validate_ui_foundations.py
      - name: Setup Node 22 for Auth-only candidate tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate one-minute Worker code and Cron config locally (NO DEPLOY)
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix tools/push-worker
          npm run check --prefix tools/push-worker
          test "$(grep -Fc '"crons": ["* * * * *"]' tools/push-worker/wrangler.jsonc)" = 1
      - name: Build first-party Auth-only Cloudflare candidate (NO DEPLOY)
        env:
          # Public Worker URL only; separate Free Worker live-smoke #45019926305 PASS (no Pages auto-deploy).
          VITE_LI_PUSH_WORKER_URL: ${{ vars.LI_PUSH_WORKER_URL || 'https://li-push-staging.dungho-product.workers.dev' }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix design-system/react
          npm install --no-audit --no-fund --prefix tools/step16-real-l09-react-island
          cd tools/step16-real-l09-react-island
          npm run extract
          npm run test:sync
          npm run test:auth-pwa
          npx tsc --noEmit
          npm run build:worker:auth-only
          VITE_LI_AUTH_TARGET=cloudflare-first-party npx vite build --config vite.cloudflare-app.config.mjs
          cd ../..
          node tools/prepare_cloudflare_ai_candidate.mjs --build-auth-only
          npx --yes --package workbox-cli@7.4.1 workbox generateSW tools/platform/workbox-auth-only-config.cjs
          test -s dist-cloudflare-auth-candidate/_worker.js
          test -s dist-cloudflare-auth-candidate/assets/li-first-party-app.js
          test -s dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'id="li-boot-splash"' dist-cloudflare-auth-candidate/index.html
          grep -Fq 'id="li-boot-error"' dist-cloudflare-auth-candidate/index.html
          grep -Fq 'laoly-state-loading.png' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'laoly-state-error.png' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'SKIP_WAITING' dist-cloudflare-auth-candidate/assets/pwa-register.js
          grep -Fq 'SKIP_WAITING' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'li-first-party-app.js' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'li-push-handler.js' dist-cloudflare-auth-candidate/sw.js
          ! grep -Fq 'neon.tech' dist-cloudflare-auth-candidate/sw.js
          find dist-cloudflare-auth-candidate -type f -name '*.map' -delete
          test -z "$(find dist-cloudflare-auth-candidate -type f -name '*.map' -print -quit)"
          git diff --exit-code -- site
      - name: Real offline cold-launch regression against emitted Auth-only Pages artifact (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          CHROME_BIN="$chrome" node tools/test_cloudflare_offline_browser.mjs
      # Preserve the independently pinned AI pilot QA; never mix its source
      # with the exact-live Auth-only candidate or enable it here.
      - name: Checkout unchanged independently pinned AI candidate
        uses: actions/checkout@v4
        with:
          ref: c32d7213494e952702488336060346e867b6c51f
          persist-credentials: false
      - name: Build one-seat Workers AI candidate (NO DEPLOY)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c32d7213494e952702488336060346e867b6c51f"
          npm install --no-audit --no-fund --prefix design-system/react
          npm install --no-audit --no-fund --prefix tools/step16-real-l09-react-island
          cd tools/step16-real-l09-react-island
          npm run extract
          node --test tests/ai-one-seat.test.mjs
          npm run build:worker
          VITE_LI_AUTH_TARGET=cloudflare-first-party npx vite build --config vite.cloudflare-app.config.mjs
          cd ../..
          node tools/prepare_cloudflare_ai_candidate.mjs --build
          LI_CLOUDFLARE_AI_BUILD=1 npx --yes --package workbox-cli@7.4.1 workbox generateSW tools/platform/workbox-auth-only-config.cjs
          find dist-cloudflare-ai-candidate -type f -name '*.map' -delete
          test -s dist-cloudflare-ai-candidate/sw.js
          grep -Fq 'li-first-party-app.js' dist-cloudflare-ai-candidate/sw.js
          grep -Fq 'li-push-handler.js' dist-cloudflare-ai-candidate/sw.js
          ! grep -Fq 'neon.tech' dist-cloudflare-ai-candidate/sw.js
          grep -Fq 'serviceWorker.register' dist-cloudflare-ai-candidate/assets/pwa-register.js
          grep -Fq '"start_url": "/"' dist-cloudflare-ai-candidate/manifest.webmanifest
          grep -Fq '"scope": "/"' dist-cloudflare-ai-candidate/manifest.webmanifest
          test -s dist-cloudflare-ai-candidate/_worker.js
          test -s dist-cloudflare-ai-candidate/assets/li-first-party-app.js
          test -z "$(find dist-cloudflare-ai-candidate -type f -name '*.map' -print -quit)"
          git diff --exit-code -- site
  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.ai_mode == false && inputs.auth_only_mode == false && inputs.push_minute_mode == false && inputs.confirm == 'PUBLISH_LI_FREE_ONLY') ||
       (inputs.ai_mode == true && inputs.auth_only_mode == false && inputs.push_minute_mode == false && inputs.confirm == 'PUBLISH_LI_AI_FREE_ONLY') ||
       (inputs.ai_mode == false && inputs.auth_only_mode == true && inputs.push_minute_mode == false && inputs.confirm == 'PUBLISH_LI_AUTH_ONLY') ||
       (inputs.ai_mode == false && inputs.auth_only_mode == true && inputs.push_minute_mode == true && inputs.confirm == 'PUBLISH_LI_AUTH_PUSH_MINUTE_FREE_ONLY'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-free-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      # Keep the reviewed candidate immutable; do not merge staging
      # to main merely to test the first-party Cloudflare capabilities.
      - name: Checkout main (static) or reviewed staging SHA (first-party)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.auth_only_mode && '0b5c434588685783299ca413860492a2ca4d4235' || (inputs.ai_mode && 'c32d7213494e952702488336060346e867b6c51f' || github.sha) }}
          persist-credentials: false

      - name: Verify the exact reviewed first-party source
        if: inputs.auth_only_mode == true || inputs.ai_mode == true
        run: |
          set -euo pipefail
          if [[ "${{ inputs.auth_only_mode }}" == "true" ]]; then
            expected='0b5c434588685783299ca413860492a2ca4d4235'
            echo 'Auth-only app: exact live Pages baseline plus offline bootstrap/cache fix; no staging-wide changes.'
          else
            expected='c32d7213494e952702488336060346e867b6c51f'
            echo 'AI mode reuses latest reviewed first-party source; approved Free-only AI pilot still requires verified private bindings and schema.'
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          echo "Verified pinned first-party candidate $expected"

      - name: Validate deployed li. source and canonical tokens
        run: |
          set -euo pipefail
          python3 tools/validate_site.py
          python3 tools/generate_design_tokens.py --check
          python3 tools/validate_design_system.py
          python3 tools/validate_ui_foundations.py

      # This path exists ONLY behind a distinct human-entered confirmation,
      # on approved main, after separately configuring the Cloudflare bindings.
      # It produces a local artifact, not a second staging site.
      - name: Set up Node 22 (explicit first-party mode only)
        if: inputs.ai_mode == true || inputs.auth_only_mode == true
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare first-party React AI backend (explicit AI mode only)
        if: inputs.ai_mode == true
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix design-system/react
          npm install --no-audit --no-fund --prefix tools/step16-real-l09-react-island
          cd tools/step16-real-l09-react-island
          npm run extract
          npm run test:auth-pwa
          node --test tests/ai-one-seat.test.mjs
          npx tsc --noEmit
          npm run build:worker
          VITE_LI_AUTH_TARGET=cloudflare-first-party npx vite build --config vite.cloudflare-app.config.mjs
          cd ../..
          node tools/prepare_cloudflare_ai_candidate.mjs --build
          LI_CLOUDFLARE_AI_BUILD=1 npx --yes --package workbox-cli@7.4.1 workbox generateSW tools/platform/workbox-auth-only-config.cjs
          find dist-cloudflare-ai-candidate -type f -name '*.map' -delete
          test -s dist-cloudflare-ai-candidate/sw.js
          grep -Fq 'li-first-party-app.js' dist-cloudflare-ai-candidate/sw.js
          grep -Fq 'li-push-handler.js' dist-cloudflare-ai-candidate/sw.js
          ! grep -Fq 'neon.tech' dist-cloudflare-ai-candidate/sw.js
          grep -Fq 'serviceWorker.register' dist-cloudflare-ai-candidate/assets/pwa-register.js
          grep -Fq '"start_url": "/"' dist-cloudflare-ai-candidate/manifest.webmanifest
          grep -Fq '"scope": "/"' dist-cloudflare-ai-candidate/manifest.webmanifest
          test -s dist-cloudflare-ai-candidate/_worker.js
          test -s dist-cloudflare-ai-candidate/assets/li-first-party-app.js
          test -z "$(find dist-cloudflare-ai-candidate -type f -name '*.map' -print -quit)"
          git diff --exit-code -- site

      - name: Prepare first-party React Auth-only PWA (explicit Auth-only approval)
        if: inputs.auth_only_mode == true && inputs.ai_mode == false
        env:
          # Public Worker URL only; separate Free Worker live-smoke #45019926305 PASS (no Pages auto-deploy).
          VITE_LI_PUSH_WORKER_URL: ${{ vars.LI_PUSH_WORKER_URL || 'https://li-push-staging.dungho-product.workers.dev' }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix design-system/react
          npm install --no-audit --no-fund --prefix tools/step16-real-l09-react-island
          cd tools/step16-real-l09-react-island
          npm run extract
          npm run test:sync
          npm run test:auth-pwa
          npx tsc --noEmit
          npm run build:worker:auth-only
          VITE_LI_AUTH_TARGET=cloudflare-first-party npx vite build --config vite.cloudflare-app.config.mjs
          cd ../..
          node tools/prepare_cloudflare_ai_candidate.mjs --build-auth-only
          npx --yes --package workbox-cli@7.4.1 workbox generateSW tools/platform/workbox-auth-only-config.cjs
          test -s dist-cloudflare-auth-candidate/_worker.js
          test -s dist-cloudflare-auth-candidate/assets/li-first-party-app.js
          test -s dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'id="li-boot-splash"' dist-cloudflare-auth-candidate/index.html
          grep -Fq 'id="li-boot-error"' dist-cloudflare-auth-candidate/index.html
          grep -Fq 'laoly-state-loading.png' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'laoly-state-error.png' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'SKIP_WAITING' dist-cloudflare-auth-candidate/assets/pwa-register.js
          grep -Fq 'SKIP_WAITING' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'li-first-party-app.js' dist-cloudflare-auth-candidate/sw.js
          grep -Fq 'li-push-handler.js' dist-cloudflare-auth-candidate/sw.js
          ! grep -Fq 'neon.tech' dist-cloudflare-auth-candidate/sw.js
          find dist-cloudflare-auth-candidate -type f -name '*.map' -delete
          test -z "$(find dist-cloudflare-auth-candidate -type f -name '*.map' -print -quit)"
          git diff --exit-code -- site

      - name: Verify current Pages baseline before offline-bootstrap release (read-only)
        if: inputs.auth_only_mode == true && inputs.ai_mode == false
        run: |
          set -euo pipefail
          test "${{ inputs.push_minute_mode }}" = "false"
          test "$CLOUDFLARE_PAGES_PROJECT" = "li5610"
          python3 - <<'PY'
          import json, os, urllib.request
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          request = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/li5610",
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:
              project = json.load(response)
          if project.get("success") is not True or (project.get("result", {}).get("canonical_deployment") or {}).get("short_id") != "5d9daa3b":
              raise SystemExit("LIVE_PAGES_BASELINE_CHANGED_STOP")
          print("EXPECTED_LIVE_PAGES_BASELINE_PASS")
          PY

      - name: Verify Cloudflare production Auth-only cookie binding (read-only)
        if: inputs.auth_only_mode == true && inputs.ai_mode == false
        run: python3 tools/check_cloudflare_auth_binding.py

      - name: Verify Cloudflare production AI/D1 bindings (read-only)
        if: inputs.ai_mode == true
        run: |
          set -euo pipefail
          python3 tools/check_cloudflare_ai_bindings.py

      - name: Hard-stop when Free plan setup or quota cannot be verified
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Free-only Cloudflare token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing account ID'; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo 'Missing Pages project name'; exit 1; }
          if [[ "${{ inputs.ai_mode }}" == "true" ]]; then
            # This flag is a human Free-plan dashboard confirmation; it does
            # not replace provider-side Free-only quota enforcement.
            test "${{ vars.LI_AI_FREE_PLAN_CONFIRMED }}" = "true" || {
              echo "Workers Free plan not explicitly confirmed; stop AI release"; exit 1;
            }
            python3 tools/g3_cloudflare_free_guard.py --site dist-cloudflare-ai-candidate --online
          elif [[ "${{ inputs.auth_only_mode }}" == "true" ]]; then
            python3 tools/g3_cloudflare_free_guard.py --site dist-cloudflare-auth-candidate --online
          else
            python3 tools/g3_cloudflare_free_guard.py --site site --online
          fi

      - name: Update same EXISTING Free Push Worker to 1-minute Cron (no new DB/VAPID)
        if: inputs.push_minute_mode == true && inputs.auth_only_mode == true && inputs.ai_mode == false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LI_PUSH_CLOUDFLARE_API_TOKEN }}
          LI_APPROVED_CRON_CHANGE: LI_PUSH_CRON_1M_EXISTING_ONLY_20261122
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing scoped Free-only Worker token'; exit 1; }
          npm install --no-audit --no-fund --prefix tools/push-worker
          npm run check --prefix tools/push-worker
          python3 tools/push-worker/scripts/update_existing_minute_cron.py --apply

      - name: Upload selected approved site only (manual main release)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ inputs.auth_only_mode && 'dist-cloudflare-auth-candidate' || (inputs.ai_mode && 'dist-cloudflare-ai-candidate' || 'site') }} --branch=main --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Explicit release log
        run: echo "Manual Cloudflare release completed; Auth-only must still pass signed iPhone PWA session persistence and invite-RLS validation before claiming P0 resolved."
