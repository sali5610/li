<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>li. Component Review Browser Fixture</title></head>
<body><pre id="result">LI_SHOWCASE_PENDING</pre><iframe id="preview" src="../site/component-library-review.html" title="Component preview" style="border:0;width:100%;height:900px"></iframe>
<script>
"use strict";
const iframe=document.getElementById("preview"),result=document.getElementById("result");
let ended=false;function finish(fail,checks){if(ended)return;ended=true;result.textContent=(fail?"LI_SHOWCASE_FAIL ":"LI_SHOWCASE_PASS ")+JSON.stringify(checks);}
iframe.addEventListener("load",()=>{
 setTimeout(()=>{
  const checks=[];
  try{
   const d=iframe.contentDocument,w=iframe.contentWindow;
   const check=(label,ok,detail)=>{checks.push({label,passed:!!ok,detail:detail||""});};
   const tokens=w.getComputedStyle(d.documentElement);
   check("Canonical generated paper token",tokens.getPropertyValue("--paper").trim().toUpperCase()==="#F3EBDC");
   check("Review pending G2",d.body.textContent.includes("Chờ Human PO duyệt component"));
   const cards=d.querySelectorAll(".ds-method");
   check("Specimen shows two method tiles",cards.length===2);
   const g=d.querySelector(".ds-method-grid");
   const col=w.getComputedStyle(g).gridTemplateColumns.split(" ").filter(Boolean);
   check("Specimen grid two columns",col.length===2,col.join(" / "));
   const actual=d.querySelector("#ds-device iframe");
   check("Embedded app uses actual live Guide route",actual?.getAttribute("src")==="./index.html?page=guide");
   const controls=[...d.querySelectorAll("[data-width]")];
   check("Real device widths available",["320","375","390","402","600","820"].every(width=>controls.some(c=>c.dataset.width===width)));
   const two=controls.find(x=>x.dataset.width==="320");
   two.click();
   check("Responsive viewport button changes iframe width",d.getElementById("ds-device").style.width==="320px");
   check("Pressed state synchronized",two.getAttribute("aria-pressed")==="true");
   const radio=d.querySelectorAll('input[name="ds-physical"]');
   check("Check-in binary radio accurately mirrored",radio.length===2);
   const nav=[...d.querySelectorAll("[data-navspec]")];
   nav[1].click();
   check("Navigation selected state responds",nav[1].getAttribute("aria-current")==="page"&&!nav[0].hasAttribute("aria-current"));
   d.getElementById("action-demo").click();
   check("Specimen action feedback is truthful",d.getElementById("action-result").textContent.includes("không điều hướng"));
   check("Lucide icons resolved to SVG",d.querySelectorAll("#icons svg.lucide").length>=12);
   const smallIcon=d.querySelector("#icons .ds-symbol-small");
   const navIcon=d.querySelector("#icons .ds-symbol-nav");
   check("Lucide size roles are 18px / 22px after SVG replacement",!!smallIcon&&!!navIcon&&w.getComputedStyle(smallIcon).width==="18px"&&w.getComputedStyle(navIcon).width==="22px",smallIcon?w.getComputedStyle(smallIcon).width+"/"+w.getComputedStyle(navIcon).width:"missing");
   check("Global icon semantic mapping: Tủ Riêng archive",!!d.querySelector('.ds-tabs [data-lucide="archive"],.ds-tabs svg.lucide'));
   check("Text-link variant and disabled state",d.querySelectorAll(".ds-link").length>=5&&!!d.querySelector(".ds-link[disabled]"));
   const light=d.querySelector(".ds-large.light"),warm=d.querySelector(".ds-large.warm");
   check("Both large-card ivory levels",!!light&&!!warm&&w.getComputedStyle(light).backgroundColor!==w.getComputedStyle(warm).backgroundColor);
   check("Subtle Home chat bubble anatomy",!!d.querySelector(".ds-home-bubble p")&&w.getComputedStyle(d.querySelector(".ds-home-bubble")).boxShadow==="none");
   check("Textarea specimen supports real input",!!d.getElementById("ds-textarea")&&!d.getElementById("ds-textarea").disabled);
   d.getElementById("ds-textarea").value="Một ý tưởng";
   d.getElementById("ds-textarea").dispatchEvent(new w.Event("input",{bubbles:true}));
   check("Textarea counter does not claim saved",d.getElementById("ds-textarea-counter").textContent.includes("chưa lưu"));
   const error=d.getElementById("ds-error");
   check("Input validation starts invalid",error.getAttribute("aria-invalid")==="true");
   error.value="Xin chào";
   error.dispatchEvent(new w.Event("input",{bubbles:true}));
   check("Input validation updates on user input",error.getAttribute("aria-invalid")==="false");
   const chips=[...d.querySelectorAll("[data-chip]")];
   chips[2].click();
   check("Filter chips change pressed state",chips[2].getAttribute("aria-pressed")==="true"&&chips[0].getAttribute("aria-pressed")==="false");
   check("4 bottom navigation variants",d.querySelectorAll(".ds-tabs button").length===4);
   const overflow=d.documentElement.scrollWidth-w.innerWidth;
   check("Review page itself has no horizontal overflow",overflow<=3,String(overflow));
  }catch(e){checks.push({label:"Runtime evaluation",passed:false,detail:e.stack||e.message});}
  finish(checks.some(c=>!c.passed),checks);
 },800);
});
setTimeout(()=>{if(!ended)finish(true,[{label:"Timed out",passed:false}]);},7000);
</script></body></html>
