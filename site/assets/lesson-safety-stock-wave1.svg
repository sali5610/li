<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="t d"><title id="t">Reorder point and safety stock diagrams</title><desc id="d">Two diagrams: demand during fixed lead time plus the preset buffer gives 150 boxes; second challenge gives a 160-set threshold and triggers reordering when inventory position is 158.</desc><rect width="1200" height="550" rx="30" fill="#f3ebdc"/><rect x="22" y="22" width="565" height="505" rx="22" fill="#fcf7ea" stroke="#c8b391"/><rect x="611" y="22" width="567" height="505" rx="22" fill="#fcf7ea" stroke="#c8b391"/><g font-family="Arial,'Noto Sans',sans-serif" fill="#293c2e"><text x="49" y="64" font-size="24" font-weight="600" fill="#293c2e">01  NGƯỠNG ĐẶT HÀNG / REORDER POINT</text><text x="641" y="64" font-size="24" font-weight="600" fill="#293c2e">02  KHI NÀO ĐẶT? / WHEN TO ORDER</text><text x="51" y="116" font-size="18" font-weight="600" fill="#293c2e">24 hộp/ngày × 5 ngày = 120 hộp</text><text x="51" y="139" font-size="14" font-weight="400" fill="#72806a">Expected demand during lead time</text><line x1="75" y1="372" x2="549" y2="372" stroke="#8c9a80" stroke-width="2"/><line x1="75" y1="197" x2="75" y2="372" stroke="#8c9a80" stroke-width="2"/><rect x="100" y="228" width="330" height="144" rx="8" fill="#b4c6a7"/><rect x="100" y="228" width="330" height="35" rx="8" fill="#668b6a"/><text x="115" y="251" font-size="18" font-weight="600" fill="#fff">Safety stock = 30</text><text x="123" y="308" font-size="22" font-weight="600" fill="#2e4b36">Lead-time demand = 120</text><text x="111" y="414" font-size="25" font-weight="600" fill="#2e4b36">120 + 30 = 150 hộp</text><text x="111" y="442" font-size="15" font-weight="400" fill="#657c64">ROP = lead-time demand + buffer</text><path d="M465 228 V372" stroke="#b8864e" stroke-width="5" stroke-dasharray="7 7"/><text x="464" y="203" font-size="15" font-weight="600" fill="#7e623b">ROP 150</text><text x="641" y="121" font-size="18" font-weight="600" fill="#293c2e">Bài tập / Challenge</text><text x="641" y="153" font-size="22" font-weight="600" fill="#2e513b">18 × 7 + 34 = 160 bộ</text><rect x="652" y="206" width="461" height="40" rx="18" fill="#e3e9df"/><rect x="652" y="206" width="431" height="40" rx="18" fill="#5f8969"/><text x="662" y="234" font-size="17" font-weight="600" fill="#fff">Inventory position = 158</text><path d="M1090 198 V286" stroke="#a64e3e" stroke-width="4" stroke-dasharray="6 5"/><text x="1027" y="311" font-size="16" font-weight="600" fill="#a64e3e">ROP 160</text><rect x="653" y="344" width="461" height="78" rx="18" fill="#e8efe3" stroke="#7a9a80" stroke-width="2"/><text x="671" y="378" font-size="22" font-weight="600" fill="#31543b">158 ≤ 160   →   ĐẶT HÀNG</text><text x="671" y="404" font-size="15" font-weight="400" fill="#5f7964">Trigger order; quantity needs separate policy</text><text x="644" y="467" font-size="16" font-weight="600" fill="#85593e">Ngưỡng đặt ≠ lượng đặt</text><text x="644" y="492" font-size="14" font-weight="400" fill="#807265">Reorder point is not order quantity.</text></g></svg>