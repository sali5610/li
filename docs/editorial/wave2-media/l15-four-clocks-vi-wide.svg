<desc id="desc">PLANNED: 10:00, Giờ Arrival theo kế hoạch, Không phải bằng chứng đã tới. ETA: 11:20, Dự báo tại 09:00 (as-of), Có thể đổi trước Arrival. ACTUAL: 11:45, Giờ sự kiện được báo là xảy ra, Không phải giờ nhận bản tin. RECEIPT: 12:00, Giờ hệ thống nhận bản tin, Không phải giờ xe thực tới. Xe có thể tới trước khi hệ thống nhận được tin.</desc>
