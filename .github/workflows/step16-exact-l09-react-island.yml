name: Step16 Exact L09 React Island (research only)

on:
  pull_request:
    paths:
      - 'tools/step16-real-l09-react-island/**'
      - 'site/assets/lesson-l09-hifi.js'
      - 'site/assets/step16-react-router.js'
      - 'site/index.html'
      - 'site/assets/app-language.js'
      - 'site/assets/design-tokens.css'
      - '.github/workflows/step16-exact-l09-react-island.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-lesson-react-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact immutable Design System #134 (research-only)
        uses: actions/checkout@v4
        with:
          ref: d22f469a52d13baa73c0c8952b198fdfeb2b2891
          path: uxds35-design-pin
          persist-credentials: false
      - name: Read exact immutable ONT-02 #137 (research-only)
        uses: actions/checkout@v4
        with:
          ref: 0fe2d9b92a66e64ea3244d910d789ccc0d458a5b
          path: uxds35-ont-pin
          persist-credentials: false
      - name: Cross-source token and ontology bridge + conflict ledger (no merge)
        env:
          LI_STAGE02B_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node tools/step16-real-l09-react-island/scripts/stage02b-source-bridge.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build one exact existing L09 authored challenge + self-review in React/TS/Vite
        working-directory: tools/step16-real-l09-react-island
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          npm run build:site-island
          npm run check:source
          npm run test:sync
          node -e 'const fs=require("fs"),z=require("zlib");const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(x=>x.isDirectory()?walk(d+"/"+x.name):[d+"/"+x.name]);const xs=walk("dist").filter(p=>p.endsWith(".js"));let raw=0,gz=0;for(const p of xs){const data=fs.readFileSync(p);raw+=data.length;gz+=z.gzipSync(data,{level:9}).length;}console.log("LI_STEP16_EXACT_L09_REACT_BUNDLE "+JSON.stringify({jsAssets:xs.length,jsRawBytes:raw,jsGzipBytes:gz,note:"single exact-source challenge/rubric island, not full li app"}));'
      - name: Stage02B browser-mount shared React candidate (local Chromium only)
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8795 --bind 127.0.0.1 --directory . > /tmp/li-02b-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          # Bounded HTTP readiness before launching Chromium. A network-service crash
          # or server bind race is infrastructure, not automatically a React defect.
          for i in {1..30}; do
            if curl --fail --silent --show-error 'http://127.0.0.1:8795/tools/step16-real-l09-react-island/dist/index.html?pilot=uxds35' > /dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl --fail --silent --show-error 'http://127.0.0.1:8795/tools/step16-real-l09-react-island/dist/index.html?pilot=uxds35' > /dev/null
          LI_UXDS35_NATIVE_URL="http://127.0.0.1:8795/uxds35-design-pin/site/component-library-review.html" \
            node tools/step16-real-l09-react-island/scripts/ui-parity-browser.cjs "$chrome" "http://127.0.0.1:8795/tools/step16-real-l09-react-island/dist/index.html?pilot=uxds35"
      - name: Upload synthetic Stage02B browser evidence (NOT Safari)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uxds35-stage02b-react-chromium
          path: /tmp/li-uxds35-stage02b/
          retention-days: 7
      - name: Exercise actual editorial content + learner behavior in real-clock Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome" ]]; then echo "FAIL: Chromium missing"; exit 1; fi
          "$chrome" --version
          node --check tools/step16-real-l09-react-island/scripts/cdp-result.cjs
          python3 -m http.server 8794 --bind 127.0.0.1 --directory . > /tmp/li-step16-real-l09-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node tools/step16-real-l09-react-island/scripts/cdp-result.cjs "$chrome"             "http://127.0.0.1:8794/tools/step16-real-l09-react-island/browser-fixture.html"             "LI_STEP16_L09_PILOT_PASS " 7 60000
          node tools/step16-real-l09-react-island/scripts/cdp-result.cjs "$chrome" \
            "http://127.0.0.1:8794/tools/step16-real-l09-react-island/native-bridge-fixture.html" \
            "LI_STEP16_L09_BRIDGE_PASS " 8 90000
          node tools/step16-real-l09-react-island/scripts/cdp-result.cjs "$chrome" \
            "http://127.0.0.1:8794/tools/step16-real-l09-react-island/auth-guard-fixture.html" \
            "LI_STEP16_L09_AUTH_PASS " 6 60000
          node tools/step16-real-l09-react-island/scripts/cdp-result.cjs "$chrome" \
            "http://127.0.0.1:8794/tools/step16-real-l09-react-island/site-shell-fixture.html" \
            "LI_STEP16_L09_SHELL_PASS " 23 90000
          echo "PASS isolated L09, native bridge, auth origin guard and local-only Vanilla shell mount"
      - name: Compose COMPLETE temporary React + DS + ONT tree (no branch merge)
        env:
          LI_STAGE02B_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/step16-real-l09-react-island/scripts/stage02b-combined-tree.mjs
      - name: Validate canonical DS and ontology on SAME temporary tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$LI_STAGE02B_COMBINED"
          python3 tools/generate_design_tokens.py --check
          python3 tools/test_design_semantic_roles.py
          node tools/generate_design_token_types.mjs --check
          node tools/validate_ontology.mjs --check
          node tools/validate_ui_ontology.mjs --check --composed-check
          python3 tools/validate_site.py
          node tools/step16-real-l09-react-island/scripts/validate-ui-ownership.mjs
          node tools/step16-real-l09-react-island/scripts/validate-visual-contract-proposal.mjs --selftest
          echo "PASS STAGE02B_FULL_TREE_DS_ONT_SOURCE"
      - name: Build actual shared React and native L09 from SAME combined tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island"
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run build:site-island
          npm run check:source
          echo "PASS STAGE02B_FULL_TREE_REACT_BUILD"
      - name: Chromium shared React against native DS specimen, same full tree
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8798 --bind 127.0.0.1 --directory "$LI_STAGE02B_COMBINED" > /tmp/li-02b-combined.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          LI_UXDS35_EVIDENCE_DIR="/tmp/li-uxds35-stage02b/combined" \
          LI_UXDS35_NATIVE_URL="http://127.0.0.1:8798/site/component-library-review.html" \
          node "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island/scripts/ui-parity-browser.cjs" "$chrome" \
            "http://127.0.0.1:8798/tools/step16-real-l09-react-island/dist/index.html?pilot=uxds35"
          echo "PASS STAGE02B_FULL_TREE_REACT_CHROMIUM"
      - name: Real native Field Navigation Dialog Feedback, same full tree
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          ln -s . "$LI_STAGE02B_COMBINED/uxds35-design-pin"
          python3 -m http.server 8797 --bind 127.0.0.1 --directory "$LI_STAGE02B_COMBINED" > /tmp/li-02b-combined-native.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node "$LI_STAGE02B_COMBINED/tools/test_uxds35_native_components_chromium.cjs" "$chrome" \
            "http://127.0.0.1:8797/uxds35-design-pin/site/component-library-review.html"
          mkdir -p /tmp/li-uxds35-stage02b/combined/native
          cp -a /tmp/li-uxds35-native-browser-evidence/. /tmp/li-uxds35-stage02b/combined/native/
          echo "PASS STAGE02B_FULL_TREE_NATIVE_CHROMIUM"
      - name: Native shell and React L09 shared-root regression, same full tree
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8794 --bind 127.0.0.1 --directory "$LI_STAGE02B_COMBINED" > /tmp/li-02b-combined-shell.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island/scripts/cdp-result.cjs" "$chrome" \
            "http://127.0.0.1:8794/tools/step16-real-l09-react-island/site-shell-fixture.html" \
            "LI_STEP16_L09_SHELL_PASS " 23 90000
          echo "PASS STAGE02B_FULL_TREE_L09_NATIVE_SHELL"
      - name: Real authored native L09 vs opt-in React L09 geometry (no visual auto-approval)
        shell: bash
        env:
          LI_STAGE02B_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8798 --bind 127.0.0.1 --directory "$LI_STAGE02B_COMBINED" > /tmp/li-02b-real-geometry-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island/scripts/l09-geometry-browser.cjs" "$chrome" "http://127.0.0.1:8798"
          node "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island/scripts/audit-geometry-gates.mjs" --selftest
          node --check "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island/scripts/l09-vcg2-browser.cjs"
          node "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island/scripts/l09-vcg2-browser.cjs" "$chrome" "http://127.0.0.1:8798"
          # Human-reviewable matched-source/state full-page visual pairs. CI does
          # NOT certify pixel equality, physical Safari or global visual G2.
          node "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island/scripts/l09-matched-visual-browser.cjs" "$chrome" "http://127.0.0.1:8798"
          echo "PASS STAGE02B_VCG2_SCOPED_RESEARCH_L09"
          echo "PASS STAGE02B_NATIVE_LEGACY_SHARED_PROVENANCE_GATES"
      - name: Research WebKit engine L09 smoke — not physical iOS Safari
        shell: bash
        env:
          LI_STAGE02B_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd "$LI_STAGE02B_COMBINED/tools/step16-real-l09-react-island"
          # The dependency is installed only into the disposable CI worktree,
          # never published to the app, production bundle or repository lockfile.
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps webkit
          node --check scripts/l09-webkit-smoke.cjs
          python3 -m http.server 8798 --bind 127.0.0.1 --directory "$LI_STAGE02B_COMBINED" > /tmp/li-02b-webkit-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl --fail --silent 'http://127.0.0.1:8798/site/index.html?lesson=L09-1-2&li-react=l09&li-vc-g2=1' >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl --fail --silent --show-error 'http://127.0.0.1:8798/site/index.html?lesson=L09-1-2&li-react=l09&li-vc-g2=1' >/dev/null
          node scripts/l09-webkit-smoke.cjs 'http://127.0.0.1:8798'
          echo "PASS STAGE02B_WEBKIT_ENGINE_RESEARCH_ONLY_NOT_IOS_SAFARI"
      - name: Upload full three-tree CI evidence (no real device or deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uxds35-stage02b-full-three-tree
          path: /tmp/li-uxds35-stage02b/
          retention-days: 7

