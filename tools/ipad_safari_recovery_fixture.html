<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>li. iPad Safari physical-rotation recovery contract</title>
<style>html,body{margin:0;padding:0}iframe{display:block;width:970px;height:832px;border:0}#result{white-space:pre-wrap;font:12px/1.5 monospace}</style></head>
<body><pre id="result">LI_SAFARI_RECOVERY_PENDING</pre><iframe id="app" title="li. live app with simulated stale viewport" src="../site/index.html"></iframe>
<script>
(function(){
"use strict";
const frame=document.querySelector("#app"),out=document.querySelector("#result"),checks=[];
let done=false;
function check(name,pass,detail){checks.push({name,passed:!!pass,detail:String(detail??"")});}
function finish(){if(done)return;done=true;const fail=checks.filter(x=>!x.passed);out.textContent=(fail.length?"LI_SAFARI_RECOVERY_FAIL ":"LI_SAFARI_RECOVERY_PASS ")+JSON.stringify({passed:checks.length-fail.length,total:checks.length,fail,checks});}
frame.addEventListener("load",function(){
 setTimeout(function(){
  try{
   const w=frame.contentWindow,d=frame.contentDocument,doc=d.documentElement;
   const originalDoc=doc;
   function mock(o,prop,value){Object.defineProperty(o,prop,{configurable:true,get(){return typeof value==="function"?value():value;}});}
   mock(w.navigator,"userAgent","Mozilla/5.0 (Macintosh; Intel Mac OS X) AppleWebKit/605.1.15 Safari/605.1");
   mock(w.navigator,"maxTouchPoints",5);
   mock(w.screen,"width",970);
   mock(w.screen,"height",1408);
   const native={angle:0,type:"portrait-primary",addEventListener(){}};
   mock(w.screen,"orientation",native);
   mock(w,"orientation",()=>native.angle);
   // Physical iPad window size changes at 90°, while the simulated iframe
   // CSS viewport intentionally remains 970px until WebKit reflows.
   mock(w,"outerWidth",()=>native.angle===90?1408:970);
   mock(w,"outerHeight",()=>native.angle===90?970:1408);
   function scene(){return d.querySelector("#page-home .hero");}
   function geom(){return scene().getBoundingClientRect();}
   function mode(){return w.getComputedStyle(doc).getPropertyValue("--li-ipad-active-mode").trim();}
   function trigger(){w.dispatchEvent(new Event("orientationchange"));}
   check("Portrait control starts at 970 CSS px",w.innerWidth===970,w.innerWidth);
   check("Portrait control uses token family",mode()==="portrait",mode());
   check("Portrait art fills 970px",Math.abs(geom().width-970)<4,geom().width);
   native.angle=90;native.type="landscape-primary";
   trigger();
   setTimeout(function(){
    const state=w.liSafariRotationQA||{};
    check("Physical 90-degree rotation recognized",state.physicalLandscape===true,state.physicalLandscape);
    check("970px-width Safari layout detected as stale",state.iPad&&state.screen[1]===1408,state.iPad+"/"+state.screen);
    check("Native viewport stays device-width; no fixed 1408 zoom",d.querySelector('meta[name="viewport"]').content.includes("width=device-width"),d.querySelector('meta[name="viewport"]').content);
    check("Physical Home canvas extends Hero to 1408 despite 970px layout",Math.abs(geom().width-1408)<4&&Math.abs(d.querySelector(".app").getBoundingClientRect().width-1408)<4,geom().width);
    check("Physical orientation token is landscape 18px",mode()==="landscape"&&w.getComputedStyle(d.body).fontSize==="18px",mode()+"/"+w.getComputedStyle(d.body).fontSize);
    check("Approved art preserved during recovery",w.getComputedStyle(scene(),"::before").backgroundImage.includes("home-li-ipad-20261119.jpg"),w.getComputedStyle(scene(),"::before").backgroundImage.slice(0,120));
    const right=d.querySelector("#page-home .hero-actions").getBoundingClientRect();
    const dialogue=d.querySelector("#page-home .hero-dialogue").getBoundingClientRect();
    check("Landscape bubble and buttons centered as PO requested",
      Math.abs((right.left+right.right)/2-704)<6&&
      Math.abs((dialogue.left+dialogue.right)/2-704)<6&&
      dialogue.bottom<=right.top+6,
      right.left+"/"+right.right+" bubble "+dialogue.left+"/"+dialogue.right);
    // Simulate WebKit completing reflow natively without reloading the app.
    frame.style.width="1408px";
    trigger();
    setTimeout(function(){
     check("Native corrected landscape remains 1408px",Math.abs(geom().width-1408)<4,geom().width);
     check("No content replacement or reload during layout change",d.documentElement===originalDoc,true);
     // Rotate back portrait: normal device-width meta and portrait geometry must return.
     native.angle=0;native.type="portrait-primary";
     frame.style.width="970px";
     frame.style.height="1270px";
     trigger();
     setTimeout(function(){
      check("Device-width viewport restored in portrait",d.querySelector('meta[name="viewport"]').content.includes("width=device-width"),d.querySelector('meta[name="viewport"]').content);
      check("Single physical canvas switched to portrait",doc.classList.contains("li-ipad-home-canvas")&&doc.classList.contains("li-ipad-home-portrait")&&!doc.classList.contains("li-ipad-home-landscape"),doc.className);
      check("Portrait geometry restored",Math.abs(geom().width-970)<4,geom().width);
      check("Portrait tokens restored",mode()==="portrait",mode());
      finish();
     },500);
    },500);
   },500);
  }catch(err){check("Fixture JS",false,err.message);finish();}
 },950);
},{once:true});
setTimeout(function(){if(!done){check("Fixture timed out",false,"no completed recovery");finish();}},8500);
})();
</script></body></html>
