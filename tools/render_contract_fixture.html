<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>li. v0.3 Browser Computed Style Smoke</title>
<style>html,body{margin:0;padding:0}iframe{display:block;width:var(--test-width,100%);height:var(--test-height,900px);border:0}#result{white-space:pre-wrap;font:12px monospace}</style><script>const params=new URLSearchParams(location.search);const width=Number(params.get("w"))||390;const heights={744:1133,820:1180,1024:768,1133:744,1194:834,1366:1024,1376:1032};document.documentElement.style.setProperty("--test-width",width+"px");document.documentElement.style.setProperty("--test-height",(Number(params.get("h"))||heights[width]||900)+"px");</script></head>
<body><pre id="result">LI_RENDER_PENDING</pre><iframe id="app" src="../site/index.html" title="li. app fixture"></iframe>
<script>
(function(){
 const out=document.getElementById("result"),frame=document.getElementById("app");
 let done=false;
 const report=(label,condition,more)=>{
   window.__checks.push({label,passed:!!condition,detail:more===undefined?"":String(more)});
 };
 window.__checks=[];
 function finish(){
   if(done)return;done=true;
   const errors=window.__checks.filter(x=>!x.passed);
   const summary={width:frame.contentWindow ? frame.contentWindow.innerWidth : -1,passed:window.__checks.length-errors.length,total:window.__checks.length,errors,checks:window.__checks};
   out.textContent=(errors.length?"LI_RENDER_FAIL ":"LI_RENDER_PASS ")+JSON.stringify(summary);
 }
 frame.addEventListener("load",function(){
  setTimeout(function(){
   try{
    const doc=frame.contentDocument,w=frame.contentWindow,root=w.getComputedStyle(doc.documentElement);
    report("Generated color --paper",root.getPropertyValue("--paper").trim().toUpperCase()==="#F1F0E9",root.getPropertyValue("--paper"));
    report("Generated spacing --li-space-4",root.getPropertyValue("--li-space-4").trim()==="16px",root.getPropertyValue("--li-space-4"));
    const touchTablet=(w.innerWidth>=1140&&w.innerWidth<=1600&&w.matchMedia("(any-pointer: coarse)").matches);
    const ipadMode=(w.innerWidth>=744&&w.innerWidth<=1139)||touchTablet;
    const landscape=ipadMode&&w.innerWidth>=1000&&w.innerWidth>w.innerHeight;
    if(params.get("touch")==="1")report("Touch QA actually emulated coarse pointer",w.matchMedia("(any-pointer: coarse)").matches,String(w.matchMedia("(any-pointer: coarse)").matches));
    const expectedBody=ipadMode?"18px":"16px",expectedLeading=ipadMode?"28px":"24px";
    report("Body uses device-specific semantic font-size",w.getComputedStyle(doc.body).fontSize===expectedBody,w.getComputedStyle(doc.body).fontSize+" expected "+expectedBody);
    report("Body uses device-specific line-height",w.getComputedStyle(doc.body).lineHeight===expectedLeading,w.getComputedStyle(doc.body).lineHeight+" expected "+expectedLeading);
    if(ipadMode){
      const expectedHeadline=landscape?"44px":"40px";
      report("iPad actual CSS mode matches viewport",root.getPropertyValue("--li-ipad-active-mode").trim()===(landscape?"landscape":"portrait"),root.getPropertyValue("--li-ipad-active-mode"));
      report("iPad headline token changes by orientation",root.getPropertyValue("--li-type-headline").trim()===expectedHeadline,root.getPropertyValue("--li-type-headline"));
      report("iPad minimum target token is 56px",root.getPropertyValue("--li-current-control-min").trim()==="56px",root.getPropertyValue("--li-current-control-min"));
      const image=w.getComputedStyle(doc.querySelector("#page-home .hero"),"::before").backgroundImage;
      report("Tablet artwork remains iPad source",image.includes("home-li-ipad-20261119.jpg"),image.slice(0,120));
    }
    const css=[...doc.styleSheets].filter(x=>x.href).map(x=>x.href);
    report("Generated + layout + lessons + foundations all loaded",["design-tokens.css","li-layout.css","lesson-l09-hifi.css","ui-foundations.css"].every(x=>css.some(y=>y.includes(x))),css.join(","));
    const mirror=doc.querySelector("#page-home .mirror-message h2");
    report("Mirror question exists",!!mirror);
    const mirrorTitle=doc.querySelector("#page-home .mirror-titlebar, #page-home .mirror-label");
    report("Home mirror title removed without hiding the question",!mirrorTitle&&!!mirror&&!!mirror.textContent.trim(),mirrorTitle?.textContent||"question remains");
    const scene=doc.querySelector("#page-home .hero");
    const image=scene?w.getComputedStyle(scene,"::before").backgroundImage:"";
    const expectedScene=w.innerWidth<=600?"home-li-iphone-20261119.jpg":ipadMode||w.innerWidth<=1139?"home-li-ipad-20261119.jpg":"home-mystic-cool-desktop.webp";
    report("Approved Home illustration matches responsive source image",image.includes(expectedScene),image.slice(0,170));

    /* UX-HOME-06: inspect the LIVE header, not the review-only specimen. */
    const topHeader=doc.querySelector(".app > .header");
    const topCss=topHeader?w.getComputedStyle(topHeader):null;
    const heroBox=scene?.getBoundingClientRect();
    const headerBox=topHeader?.getBoundingClientRect();
    const brandSeal=doc.querySelector(".app > .header .brand-stamp");
    const tool=doc.querySelector(".app > .header .tool-button");
    const cssClear=value=>value==="rgba(0, 0, 0, 0)"||value==="transparent";
    report("Home header uses genuinely transparent Component Library overlay",!!topCss&&cssClear(topCss.backgroundColor)&&topCss.borderBottomWidth==="0px"&&topCss.boxShadow==="none",topCss?.backgroundColor+"/"+topCss?.borderBottomWidth);
    report("Home artwork extends behind top navigation",!!heroBox&&!!headerBox&&Math.abs(heroBox.top-headerBox.top)<=2&&headerBox.height>=60,heroBox?.top+"/"+headerBox?.top+"/"+headerBox?.height);
    report("Transparent Home artwork also covers bottom viewport",!!heroBox&&heroBox.bottom>=w.innerHeight-2,"sceneBottom="+heroBox?.bottom+" viewport="+w.innerHeight);
    const rootScroll=w.getComputedStyle(doc.documentElement).overflowY;
    const bodyScroll=w.getComputedStyle(doc.body).overflowY;
    report("Home vertical scrolling disabled on document and body",rootScroll==="hidden"&&bodyScroll==="hidden",rootScroll+"/"+bodyScroll);
    report("Home hero exactly one visible dynamic viewport tall",!!heroBox&&Math.abs(heroBox.height-w.innerHeight)<3,"hero="+heroBox?.height+" viewport="+w.innerHeight);
    report("Home overlay renders light seal and icon ink",!!brandSeal&&w.getComputedStyle(brandSeal).filter.includes("invert(1)")&&!!tool&&w.getComputedStyle(tool).color==="rgb(250, 249, 245)",brandSeal?w.getComputedStyle(brandSeal).filter:"missing");
    report("Home overlay utility keeps 48px touch area",!!tool&&tool.getBoundingClientRect().width>=48&&tool.getBoundingClientRect().height>=48,tool?.getBoundingClientRect().width+"x"+tool?.getBoundingClientRect().height);
    if(landscape){
      const titleRail=doc.querySelector("#page-home .hero-left").getBoundingClientRect();
      const mirrorRail=doc.querySelector("#page-home .mirror-message").getBoundingClientRect();
      const contextRail=doc.querySelector("#page-home .hero-dialogue").getBoundingClientRect();
      const actionRail=doc.querySelector("#page-home .hero-actions").getBoundingClientRect();
      report("Landscape Home has three distinct horizontal zones",titleRail.right<w.innerWidth*.37&&Math.abs((mirrorRail.left+mirrorRail.width/2)/w.innerWidth-.49)<.035&&contextRail.left>w.innerWidth*.66&&actionRail.left>w.innerWidth*.66,JSON.stringify({titleRight:Math.round(titleRail.right),mirrorCenter:Math.round(mirrorRail.left+mirrorRail.width/2),contextLeft:Math.round(contextRail.left),actionLeft:Math.round(actionRail.left)}));
      report("Landscape context aligns above right action rail",Math.abs(contextRail.left-actionRail.left)<3&&contextRail.bottom<actionRail.top&&actionRail.bottom<=w.innerHeight-12,Math.round(contextRail.left)+"/"+Math.round(actionRail.left)+"/"+Math.round(contextRail.bottom)+"/"+Math.round(actionRail.top));
    }
    if(w.innerWidth>=601&&w.innerWidth<=1139){
     const ringCopy=doc.querySelector("#page-home .mirror-message").getBoundingClientRect();
     const sceneBox=scene.getBoundingClientRect();
     const x=(ringCopy.left+ringCopy.width/2-sceneBox.left)/sceneBox.width;
     report("Tablet question remains centered inside supplied mirror",Math.abs(x-0.49)<0.04,x.toFixed(3));
    }
    if(w.innerWidth<=600){
     const nav=doc.querySelector(".mobile-nav .nav-btn");
     const headerControl=doc.querySelector(".header .tool-button");
     const headerTap=headerControl?w.getComputedStyle(headerControl).webkitTapHighlightColor:"missing";
     const bottomTap=nav?w.getComputedStyle(nav).webkitTapHighlightColor:"missing";
     const tapInvisible=value=>value==="rgba(0, 0, 0, 0)"||value==="transparent";
     report("Mobile bottom tab + header tool have no square native tap flash",tapInvisible(headerTap)&&tapInvisible(bottomTap),headerTap+"/"+bottomTap);

     report("Mobile bottom nav support label 14px",!!nav&&w.getComputedStyle(nav).fontSize==="14px",nav?w.getComputedStyle(nav).fontSize:"missing");
    }
    if(typeof w.navigate==="function")w.navigate("guide",{focus:false,syncUrl:false});
    const restoredCss=topHeader?w.getComputedStyle(topHeader):null;
    report("Leaving Home restores paper header surface",!!restoredCss&&restoredCss.backgroundColor==="rgb(241, 240, 233)"&&restoredCss.marginBottom==="0px",restoredCss?.backgroundColor+"/"+restoredCss?.marginBottom);
    report("Leaving Home restores normal browser scrolling",w.getComputedStyle(doc.documentElement).overflowY!=="hidden"&&w.getComputedStyle(doc.body).overflowY!=="hidden",w.getComputedStyle(doc.documentElement).overflowY+"/"+w.getComputedStyle(doc.body).overflowY);
    setTimeout(function(){
      try{
       const cards=doc.querySelectorAll("#page-guide #method-cards>.method-card");
       report("Guide cards populated",cards.length>0,cards.length);
       const decorativeKicker=doc.querySelector("#page-guide .section-shell > .kicker");
       const decorativeKickerCss=decorativeKicker?w.getComputedStyle(decorativeKicker):null;
       report("Olive is a 3px editorial decoration, not a control fill",
         !!decorativeKickerCss&&decorativeKickerCss.borderInlineStartColor==="rgb(101, 115, 76)"&&decorativeKickerCss.borderInlineStartWidth==="3px",
         decorativeKickerCss?.borderInlineStartColor+"/"+decorativeKickerCss?.borderInlineStartWidth);
       report("Notebook writing line uses canonical 32px typed token",root.getPropertyValue("--li-leading-notebook").trim()==="32px",root.getPropertyValue("--li-leading-notebook"));
       const pill=doc.querySelector("#page-guide #method-filters .filter");
       report("Actual Guide category filters are fully rounded pills",!!pill&&w.getComputedStyle(pill).borderTopLeftRadius==="999px",pill?w.getComputedStyle(pill).borderTopLeftRadius:"missing");

       if(cards.length){
        const title=cards[0].querySelector("h3");
        report("Guide title role matches phone / iPad / desktop",!!title&&w.getComputedStyle(title).fontSize===(w.innerWidth<=640?"20px":ipadMode?(w.innerWidth>=1000?"32px":"28px"):"24px"),title?w.getComputedStyle(title).fontSize:"missing");
        const purpose=cards[0].querySelector(".purpose");
        report("Guide explanation >=14px (full detail reachable)",!!purpose&&parseFloat(w.getComputedStyle(purpose).fontSize)>=14,purpose?(w.getComputedStyle(purpose).fontSize+" "+w.getComputedStyle(purpose).display):"missing");
       }
       if(ipadMode) {
         const firstAction=doc.querySelector("#page-guide .page-heading + * .action, #page-guide .filter");
         const controlSize=firstAction?firstAction.getBoundingClientRect().height:0;
         report("iPad first control target is at least 56px",controlSize>=56,controlSize);
         const surface=doc.querySelector("#page-guide .surface");
         const inset=surface?parseFloat(w.getComputedStyle(surface).paddingLeft):0;
         report("iPad card inset follows orientation token",inset>=(w.innerWidth>=1000?32:28),inset);
         if(w.innerWidth>=1000){
           const editor=doc.querySelector("#page-guide .editorial-grid");
           const columns=editor?w.getComputedStyle(editor).gridTemplateColumns.split(" ").filter(Boolean):[];
           report("iPad landscape uses a two-column editorial desk",columns.length===2,columns.join(" / "));
         }
       }
       const guideGrid=doc.getElementById("method-cards");
       const guideGridCSS=guideGrid?w.getComputedStyle(guideGrid):null;
       const guideColumns=guideGridCSS?guideGridCSS.gridTemplateColumns.split(" ").filter(Boolean):[];
        if(landscape&&w.innerWidth>=1140) report("Wide touch iPad landscape uses three method columns",guideColumns.length===3,guideColumns.join(" / "));
       if(w.innerWidth<=640){
        report("PO S116/S118 Guide is 2-up on phone",guideColumns.length===2,guideGridCSS?guideGridCSS.gridTemplateColumns:"missing");
        const cards2=[...cards].slice(0,2);
        const cardsFit=cards2.length===2&&cards2[0].getBoundingClientRect().top===cards2[1].getBoundingClientRect().top&&cards2.every(c=>c.getBoundingClientRect().right<=w.innerWidth+2);
        report("Guide two tiles share row, no clipping",cardsFit,cards2.map(c=>Math.round(c.getBoundingClientRect().width)).join("/"));
        const teaser=w.getComputedStyle(cards2[0].querySelector(".purpose"));
        report("Guide minimal purpose is two-line preview, accessible full detail",teaser.getPropertyValue("-webkit-line-clamp")==="2"&&parseFloat(teaser.fontSize)>=14,teaser.fontSize+" clamp="+teaser.getPropertyValue("-webkit-line-clamp"));
        const gap=getComputedStyle(guideGrid);
        const expectedCol=w.innerWidth<=360?14:18;
        const expectedRow=w.innerWidth<=360?18:20;
        report("Guide S118 exact PO-approved column and row spacing",Math.round(parseFloat(gap.columnGap))===expectedCol&&Math.round(parseFloat(gap.rowGap))===expectedRow,gap.columnGap+"/"+gap.rowGap);

       }
       const overflow=doc.documentElement.scrollWidth-w.innerWidth;
       const overflowNodes=[...doc.querySelectorAll("body *")].map(el=>({el,rect:el.getBoundingClientRect()}))
         .filter(x=>x.rect.width>0&&x.rect.right>w.innerWidth+4&&x.rect.top<w.innerHeight+120)
         .slice(0,12).map(x=>({tag:x.el.tagName,id:x.el.id,cls:typeof x.el.className==="string"?x.el.className.slice(0,65):"",right:Math.round(x.rect.right),width:Math.round(x.rect.width)}));
       report("No significant horizontal page overflow",overflow<=4,overflow+"px "+JSON.stringify(overflowNodes));
      }catch(e){report("Guide computed style evaluation",false,e.message);}
      finish();
    },350);
   }catch(e){report("Computed-style smoke runtime",false,e.stack||e.message);finish();}
  },350);
 });
 setTimeout(function(){if(!done){report("Fixture loaded within budget",false,"timeout");finish();}},7000);
})();
</script></body></html>
