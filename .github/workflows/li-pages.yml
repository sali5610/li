name: Publish li. STAGING to GitHub Pages (Cloudflare-independent)

# GitHub Pages is the low-cost test environment, not the Cloudflare production site.
# Only integration/staging pushes update STAGING. No Cloudflare API, secrets or deploy.
on:
  push:
    branches: [integration/staging]
    paths:
      - 'site/**'
      - 'design-system/**'
      - 'tools/**'
      - 'db/migrations/**'
      - '.github/workflows/li-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-li
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/integration/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The existing github-pages environment restricts deployment refs to main.
    # Dedicated environment metadata, SAME public /li/ site, no second staging URL.
    environment:
      name: li-staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout integration/staging source tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate static site and design tokens first
        run: |
          set -euo pipefail
          python3 tools/validate_site.py
          python3 tools/generate_design_tokens.py --check
          python3 tools/validate_design_system.py
          python3 tools/validate_ui_foundations.py
          test ! -e site/auth-pilot || { echo "Auth route unexpectedly tracked in main"; exit 1; }

      # All assets are built from the same checked-out integration/staging HEAD.
      - name: Verify strict login gate and native lesson key
        run: |
          set -euo pipefail
          test -s tools/step16-real-l09-react-island/src/auth/AuthPanel.tsx
          root=tools/step16-real-l09-react-island
          grep -Fq "VITE_LI_AUTH_TARGET!=='github-pages-staging'" "$root/vite.staging-app.config.mjs"
          grep -Fq "checkInviteAccess" "$root/src/auth/AuthPanel.tsx"
          grep -Fq "classList.toggle('li-auth-verified'" "$root/src/auth/AuthPanel.tsx"
          grep -Fq "IS_GITHUB_STAGING" "$root/src/auth/config.ts"
          grep -Fq "neonAuth.getJWTToken()" "$root/src/auth/neon-client.ts"
          grep -Fq "startLearnerSync" "$root/src/auth/AuthPanel.tsx"
          grep -Fq "prepareLearnerAccount" "$root/src/auth/AuthPanel.tsx"
          # Owner-scoped sync contains public pack-approved lessons plus the 17
          # personal study manuscripts ONLY in the invited GitHub staging target.
          grep -Fq "const LESSONS=learnableLessonIds" "$root/src/auth/learner-sync.ts"
          grep -Fq "isLearnableLessonId(lesson)" "$root/src/learning/staging-ports.ts"
          grep -Fq "navigationPublished===true" "$root/src/learning/released-lessons.ts"
          grep -Fq "packed.has(l.id)" "$root/src/learning/released-lessons.ts"
          grep -Fq "VITE_LI_AUTH_TARGET==='github-pages-staging'" "$root/src/learning/released-lessons.ts"
          grep -Fq "personalStudySet.has(id)" "$root/src/learning/released-lessons.ts"
          grep -Fq "await checkInviteAccess" "$root/src/auth/learner-sync.ts"
          # The real L03/L09/L15 owner now writes a durable Dexie outbox,
          # then signed Neon through the shared revision-aware syncOnce.
          grep -Fq "await store.edit(" "$root/src/auth/learner-sync.ts"
          grep -Fq "await syncOnce(store,api,uid" "$root/src/auth/learner-sync.ts"
          grep -Fq "await api.one('lesson_attempt',id)" "$root/src/auth/learner-sync.ts"
          grep -Fq 'isBlankNativeAttempt' "$root/src/auth/learner-sync.ts"
          ! grep -Eq "signIn.email|AuthRecovery|AuthEmailVerification" "$root/src/auth/AuthPanel.tsx"
          test ! -e "$root/src/auth/qa-secrets.ts"
          echo "PASS invited-only Google sign-in gate and canonical released-lesson registry for Neon"

      - name: Set up free GitHub runner
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app imports canonical React DS components from a sibling directory.
      # Install its already-pinned icon/React dependencies before app TypeScript resolves them.
      - name: Install shared Design System dependencies once
        working-directory: design-system/react
        run: npm install --no-audit --no-fund

      - name: Build signed-in app shell and run focused Neon contracts
        working-directory: tools/step16-real-l09-react-island
        env:
          VITE_LI_AUTH_TARGET: github-pages-staging
          # Public only; unset until a separate FREE push Worker is approved/deployed.
          VITE_LI_PUSH_STAGING_URL: ${{ vars.LI_PUSH_STAGING_URL }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run extract
          node ../checkin_adaptation_regression.mjs
          npm run test:sync
          npx tsc --noEmit
          npx vite build --config vite.staging-app.config.mjs
          test -s dist-staging-app/staging-auth-gate.js
          test "$(find dist-staging-app -maxdepth 1 -type f -name '*.css' | wc -l)" -eq 1
          grep -Fq 'data-li-react-journey' dist-staging-app/staging-auth-gate.js
          grep -Fq 'li-react-l09-host' dist-staging-app/staging-auth-gate.js
          test -z "$(find dist-staging-app -type f -name '*.map' -print -quit)"
          grep -Fq 'li-auth-verified' dist-staging-app/staging-auth-gate.js
          echo "PASS compiled real app login gate, no secrets or maps"

      - name: Assemble ONE user-facing invited-only staging app
        run: |
          set -euo pipefail
          cp tools/step16-real-l09-react-island/dist-staging-app/*.js site/assets/
          # Versioned filename means a newly opened iOS Safari page cannot use
          # the previous Workbox CSS precache before its new worker activates.
          # The new file is still precached by the generated worker for offline PWA.
          cp tools/step16-real-l09-react-island/dist-staging-app/*.css "site/assets/li-react-learning-${GITHUB_SHA:0:12}.css"
          cp tools/step16-real-l09-react-island/src/auth/staging-gate.css site/assets/
          node tools/build_content_packs.mjs --check
          node tools/test_content_adapter.mjs
          bash tools/test_search_rendered.sh
          touch site/.nojekyll
          git diff --exit-code -- site/
          python3 - <<'PY'
          from pathlib import Path
          import os
          index=Path('site/index.html')
          html=index.read_text(encoding='utf-8')
          assert html.count('<head>')==1 and html.count('</body></html>')==1
          assert 'id="page-settings"' in html
          assert 'lesson-l09-hifi-markup.js' in html
          assert 'step16-react-router.js' not in html
          # Exactly ONE L09 controller: the integrated React module. The old
          # native controller keeps stale in-memory state and could overwrite
          # React answers during a global language change.
          old_l09='<script src="./assets/lesson-l09-hifi.js"></script>'
          assert html.count(old_l09)==1, 'Native L09 source changed'
          html=html.replace(old_l09,'',1)
          # One React Catalog/Search owner in the invited app. Three old
          # classic scripts still ship in standalone source for native fallback,
          # but may NOT execute in the unified signed-in Pages build.
          import re
          html,count=re.subn(
           r'<script src="\./assets/(?:catalog-curriculum-data|catalog-drilldown|li-catalog-search)\.js(?:\?v=[^"]+)?"></script>',
           '',html)
          assert count==3,'Expected exactly three retired native Catalog/Search scripts'
          # The React FAB now owns drag, focus, normalized position and live
          # avatar port. Never bind the old pointer/keyboard listeners first.
          old_drag='<script src="./assets/laoly-drag.js?v=20261119-control-dodge"></script>'
          assert html.count(old_drag)==1,'Native Lão Lý drag source changed'
          html=html.replace(old_drag,'',1)
          # React LessonJourney/Wave1Journey own visible spell suggestions,
          # and React RelatedLessons owns the knowledge graph. Neither old
          # DOM writer belongs in the invited React app.
          retired_lesson_ui=(
           './assets/lesson-spell-suggestions.js?v=wave1-method-fit-preview',
           './assets/lesson-related-wave1.js'
          )
          for src in retired_lesson_ui:
           legacy='<script src="'+src+'"></script>'
           assert html.count(legacy)==1,'Native lesson decoration source changed: '+src
           html=html.replace(legacy,'',1)
          # Keep the auth gate fail-closed *before* everything else.
          # React CSS is the final UI layer: inserting it at the opening <head>
          # let legacy CSS silently override the redesigned iPhone layouts.
          gate=('<style id="li-auth-gate-critical">'
                'html:not(.li-auth-verified) .app,'
                'html.li-auth-verified.li-account-open .app{display:none!important}'
                'html.li-auth-verified:not(.li-account-open) #li-staging-auth-root'
                '{display:none!important}</style>')
          html=html.replace('<head>','<head>'+gate,1)
          react_css='./assets/li-react-learning-'+os.environ['GITHUB_SHA'][:12]+'.css'
          final_styles=(
           '<link rel="stylesheet" href="./assets/staging-gate.css?v=invite-shell-1">'
           '<link rel="stylesheet" href="'+react_css+'">')
          assert html.count('</head>')==1,'Missing unique app head'
          html=html.replace('</head>',final_styles+'</head>',1)
          assert html.index('li-layout.css') < html.index(react_css),(
           'React UI styles must load AFTER the legacy stylesheets')
          marker='<div class="settings-group-grid"><article class="surface"><div class="kicker">SAO LƯU</div>'
          assert html.count(marker)==1, 'Settings account slot changed'
          account=('<article class="surface" data-staging-only="true">'
            '<div class="kicker">TÀI KHOẢN</div>'
            '<h2>Tài khoản Google</h2>'
            '<p class="small">Email đã được mời. Xem tài khoản và '
            'đăng xuất tại đây.</p>'
            '<button type="button" class="action alt" id="li-open-account">'
            'Quản lý tài khoản</button></article>')
          html=html.replace(marker,marker.replace('<article class="surface">',account+'<article class="surface">',1),1)
          old='<b>Đồng bộ giữa các thiết bị</b><p class="small">Chưa hỗ trợ.</p>'
          new='<b>Đồng bộ dữ liệu cá nhân</b><p class="small" id="li-cloud-status" role="status" aria-live="polite">Đang kết nối Neon để đồng bộ dữ liệu theo tài khoản…</p>'
          assert html.count(old)==1,'Settings sync description changed'
          html=html.replace(old,new,1)
          # The iOS Workbox precache intentionally ignores the legacy ?v=
          # query parameter. An actual build-id parameter forces old workers to
          # fetch the new app JS while the replacement worker takes control.
          shell=('<div id="li-staging-auth-root" tabindex="-1" '
            'role="region" aria-label="Đăng nhập li.">'
            '<p role="status">Đang xác minh quyền truy cập…</p></div>'
            '<script type="module" src="./assets/staging-auth-gate.js?li_build='
            +os.environ['GITHUB_SHA'][:12]+'"></script>')
          html=html.replace('</body></html>',shell+'</body></html>',1)
          index.write_text(html,encoding='utf-8')
          for path in ['auth-pilot','l09-preview']:
           legacy=Path('site')/path/'index.html'
           legacy.parent.mkdir(parents=True,exist_ok=True)
           legacy.write_text('<!doctype html><html lang="vi"><head>'
             '<meta charset="utf-8"><meta name="robots" content="noindex">'
             '<meta http-equiv="refresh" content="0;url=../">'
             '<title>li.</title></head><body>'
             '<p>Mở <a href="../">li. — Thư viện tri thức</a></p>'
             '</body></html>',encoding='utf-8')
          print('PASS one normal app: invited login → native lesson → feedback → progress')
          PY
          test -s site/assets/staging-auth-gate.js
          test -s "site/assets/li-react-learning-${GITHUB_SHA:0:12}.css"
          grep -Fq "li-react-learning-${GITHUB_SHA:0:12}.css" site/index.html
          # Verify that the submitted mirror styling exists in the emitted bundle.
          grep -Fq 'li-home-mirror-art-image' "site/assets/li-react-learning-${GITHUB_SHA:0:12}.css"
          ! grep -Fq '<script src="./assets/lesson-l09-hifi.js"></script>' site/index.html
          ! grep -Eq '<script src="./assets/(catalog-curriculum-data|catalog-drilldown|li-catalog-search)\.js' site/index.html
          ! grep -Fq '<script src="./assets/laoly-drag.js' site/index.html
          ! grep -Eq '<script src="./assets/(lesson-spell-suggestions|lesson-related-wave1)\.js' site/index.html
          grep -Fq 'li-auth-gate-critical' site/index.html
          grep -Fq "staging-auth-gate.js?li_build=${GITHUB_SHA:0:12}" site/index.html
          grep -Fq 'id="li-staging-auth-root"' site/index.html
          grep -Fq 'id="li-open-account"' site/index.html
          grep -Fq 'id="li-cloud-status"' site/index.html
          test -z "$(find site -type f \( -name '*.map' -o -name '.env*' -o -name '*qa-secrets*' \) -print -quit)"
          node tools/test_l09_guided_runtime.js
          node tools/test_navigation.js
          echo 'App entry: https://sali5610.github.io/li/ — login BEFORE any lesson, native Wave1 auto-sync'
          echo 'No React pilot router, no guest mode, no Cloudflare release'

      - name: Browser-smoke mandatory invited login gate (fresh session, no user login)
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome" || { echo 'FAIL no browser for critical login gate'; exit 1; }
          cat > site/li-login-smoke.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"></head><body>
          <pre id="result">LI_AUTH_GATE_PENDING</pre>
          <iframe id="app" src="./index.html?auth-smoke-fresh=1" title="Auth gate" style="position:absolute;left:-200vw;width:390px;height:844px"></iframe>
          <script>
          const frame=document.getElementById('app'),out=document.getElementById('result');
          function check(){
           try{
            const doc=frame.contentDocument;
            const app=doc.querySelector('.app');
            const root=doc.querySelector('#li-staging-auth-root');
            const critical=doc.getElementById('li-auth-gate-critical');
            const hidden=app&&doc.defaultView.getComputedStyle(app).display==='none';
            const rootShown=root&&doc.defaultView.getComputedStyle(root).display!=='none';
            const unverified=!doc.documentElement.classList.contains('li-auth-verified');
            // Route hosts exist without exposing content to anonymous users.
            const ids=['L0311','L0313','L0321','L0322','L0323',
             'L0913','L0921','L0922','L0923','L0931','L0932','L0933',
             'L1521','L1523','L1531','L1532','L1533'];
            const routesReady=ids.every(id=>doc.getElementById('page-draftLesson'+id));

            out.textContent=(critical&&hidden&&rootShown&&unverified&&routesReady)?
             'LI_AUTH_GATE_PASS':'LI_AUTH_GATE_FAIL';
           }catch(e){out.textContent='LI_AUTH_GATE_FAIL';}
          }
          frame.addEventListener('load',check);
          if(frame.contentDocument?.readyState==='complete')check();
          </script></body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/li-auth-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f site/li-login-smoke.html' EXIT
          sleep 1
          dom="$("$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1100,900 --virtual-time-budget=8500 \
            --dump-dom http://127.0.0.1:8765/li-login-smoke.html 2>/tmp/li-auth-browser.log || true)"
          if [[ "$dom" != *'<pre id="result">LI_AUTH_GATE_PASS</pre>'* ]]; then
            echo "FAIL fresh browser login gate"
            echo "$dom" | grep -F '<pre id="result">' | tail -1 || true
            tail -15 /tmp/li-auth-browser.log || true
            exit 1
          fi
          echo 'PASS browser: login gate intact and all 17 personal lesson routes registered'

      - name: Generate offline Workbox service worker for integrated staging
        run: |
          set -euo pipefail
          npx --yes --package workbox-cli@7.4.1 workbox generateSW tools/platform/workbox-config.cjs
          test -s site/sw.js
          test -s site/assets/li-push-handler.js
          grep -Fq 'li-push-handler.js' site/sw.js
          grep -Fq 'assets/li-content-adapter.mjs' site/sw.js
          grep -Fq 'content-packs/graph.json' site/sw.js
          grep -Fq 'content-packs/search.json' site/sw.js
          test -s site/manifest.webmanifest
          test -s site/assets/pwa-register.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('site/manifest.webmanifest').read_text())
          assert m['scope']=='/li/' and m['start_url']=='/li/'
          sw=Path('site/sw.js').read_text()
          assert 'index.html' in sw
          assert 'neon.tech' not in sw
          print('PASS PWA scope, offline shell precache and no Neon responses')
          PY

      # Build Design System directly from this integration/staging checkout.
      # Preview and learner app share one canonical source tree.
      - name: Compile actual React Components for existing Component Library URL
        working-directory: design-system/react
        run: |
          set -euo pipefail
          npm run check
          npm run build
          test -s ../../site/design-system/react-layout.js
          test -s ../../site/design-system/react-atoms.js
          test -s ../../site/design-system/react-controls.js
          test -s ../../site/design-system/react-components.js

      - name: Stage Design System routes from integration HEAD (no app changes)
        run: |
          set -euo pipefail
          mkdir -p site/design-system/assets
          test -s site/design-system/index.html
          cp site/assets/design-tokens.css site/design-system/assets/
          cp site/assets/li-layout.css site/design-system/assets/
          test -s site/component-library-review.html
          test -s site/component-library-archive.html
          python3 - <<'PY'
          import os
          from pathlib import Path
          for page in Path('site/design-system').glob('*.html'):
              html=page.read_text(encoding='utf-8')
              page.write_text(html.replace('../assets/','./assets/'),encoding='utf-8')
          # UI Lab bundles keep the same filenames across deploys; force each
          # staging revision to fetch its matching JS and CSS instead of cache.
          lab=Path('site/design-system/ui-lab.html')
          html=lab.read_text(encoding='utf-8')
          rev=os.environ['GITHUB_SHA'][:12]
          for asset,attr in (('react-ui-lab.js','src'),('react-ui-lab.css','href')):
              old=f'{attr}="./{asset}"'
              assert html.count(old)==1, f'Missing UI Lab asset: {asset}'
              html=html.replace(old,f'{attr}="./{asset}?li_build={rev}"')
          lab.write_text(html,encoding='utf-8')
          print(f'PASS UI Lab bundle cache bust for {rev}')
          PY
          grep -Fq 'design-system/' site/component-library-review.html
          grep -Fq 'data-width="1408" data-height="832"' site/design-system/index.html
          grep -Fq 'data-width="970" data-height="1408"' site/design-system/index.html
          test -s site/design-system/react-components.js
          test -s site/design-system/react-components.css
          test -s site/design-system/assets/design-tokens.css
          test -z "$(find site/design-system -type f \( -name '*.map' -o -name '.env*' \) -print -quit)"
          echo 'GitHub Component Library: https://sali5610.github.io/li/component-library-review.html'
          echo 'The learner staging login gate and cloud production are untouched'

      # Identify the actual deployed tree, not merely the last merged PR.
      # Useful on iOS PWA where a previous service worker may still serve old assets.
      - name: Stamp deployed staging source revision
        run: |
          printf '{"sha":"%s","branch":"integration/staging"}\n' "$GITHUB_SHA" > site/build-info.json
          test -s site/build-info.json

      - name: Configure GitHub Pages STAGING
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages STAGING artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      # Artifact upload can complete before GitHub's artifact listing endpoint indexes it.
      - name: Let GitHub Pages artifact metadata become visible
        run: sleep 12

      - name: Publish STAGING ONLY (not a Cloudflare deployment)
        id: deployment
        uses: actions/deploy-pages@v4

      # A green build is not a published app. Verify the public Pages URL serves
      # this exact SHA before marking the staging release successful.
      - name: Verify public staging serves this exact commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://sali5610.github.io/li/build-info.json?source=${GITHUB_SHA}"
          lab_url="https://sali5610.github.io/li/design-system/ui-lab.html?source=${GITHUB_SHA}"
          rev="${GITHUB_SHA:0:12}"
          for attempt in $(seq 1 15); do
            payload="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "$url" || true)"
            lab="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "$lab_url" || true)"
            if [[ "$payload" == *"\"sha\":\"${GITHUB_SHA}\""* &&
                  "$lab" == *"react-ui-lab.js?li_build=${rev}"* &&
                  "$lab" == *"react-ui-lab.css?li_build=${rev}"* ]]; then
              echo "LIVE_SHA_PASS ${GITHUB_SHA} — $url"
              echo "LIVE_UI_LAB_REV_PASS ${rev} — $lab_url"
              exit 0
            fi
            echo "Public staging revision not yet visible (attempt ${attempt}/15)"
            sleep 8
          done
          echo "LIVE_STAGING_FAIL: app SHA and UI Lab JS/CSS must match ${GITHUB_SHA}"
          exit 1

      - name: Staging-only release note
        run: |
          echo "Integrated source HEAD $(git rev-parse HEAD) published to one GitHub Pages staging URL."
          echo "Neon already trusts https://sali5610.github.io; no Cloudflare production release."
