name: li. Push NEON redirect fix — existing Free Worker only, manual

# PR runs are read-only. Production may be updated ONLY through an explicit
# main-branch workflow_dispatch following separate Human PO approval.
on:
  pull_request:
    paths:
      - '.github/workflows/li-push-neon-redirect-worker-only.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Enter PUBLISH_LI_PUSH_NEON_REDIRECT_EXISTING_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: li-push-neon-redirect-worker-only
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f44bf4046b2e1200401c0ddc40b67e2a4f7a443
          persist-credentials: false
      - name: Verify isolated source candidate SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9f44bf4046b2e1200401c0ddc40b67e2a4f7a443"
          grep -Fq "method:'POST',redirect:'manual'" tools/push-worker/src/index.mjs
          ! grep -Fq "method:'POST',redirect:'error'" tools/push-worker/src/index.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused Worker and Python preflight tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix tools/push-worker
          npm run check --prefix tools/push-worker
          python3 -m py_compile tools/push-worker/scripts/deploy_existing_neon_redirect.py
      - name: Bundle exact Worker source locally, never deploy
        run: |
          set -euo pipefail
          cd tools/push-worker
          ./node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/li-push-neon-redirect-candidate
          test -s /tmp/li-push-neon-redirect-candidate/index.js
      - name: REAL workerd bundle integration - local D1 and live Neon invalid signature
        env:
          LI_QA_WORKER_BUNDLE: /tmp/li-push-neon-redirect-candidate/index.js
        run: node tools/push-worker/scripts/qa-bundle-workerd.mjs
      - name: Confirm PR QA never deployed Cloudflare
        run: echo "PR_SOURCE_ONLY -- no Cloudflare Worker/Pages/D1/Neon data/permission writes."

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'PUBLISH_LI_PUSH_NEON_REDIRECT_EXISTING_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-free-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.LI_PUSH_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LI_APPROVED_PUSH_NEON_REDIRECT_RELEASE: LI_PUSH_NEON_REDIRECT_EXISTING_ONLY_20261123
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f44bf4046b2e1200401c0ddc40b67e2a4f7a443
          persist-credentials: false
      - name: Verify only immutable approved source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9f44bf4046b2e1200401c0ddc40b67e2a4f7a443"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "LI_PUSH_REDIRECT_PINNED_SOURCE_PASS 9f44bf4046b2e1200401c0ddc40b67e2a4f7a443"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all local checks BEFORE any production Worker change
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix tools/push-worker
          npm run check --prefix tools/push-worker
          python3 -m py_compile tools/push-worker/scripts/deploy_existing_neon_redirect.py
          cd tools/push-worker
          ./node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/li-push-neon-redirect-preflight
          test -s /tmp/li-push-neon-redirect-preflight/index.js
      - name: Verify real workerd bundle + local D1 + read-only fake Neon auth
        env:
          LI_QA_WORKER_BUNDLE: /tmp/li-push-neon-redirect-preflight/index.js
        run: node tools/push-worker/scripts/qa-bundle-workerd.mjs
      - name: ONE existing Free Worker update, preserving D1/VAPID/1-min Cron
        run: |
          set -euo pipefail
          python3 tools/push-worker/scripts/deploy_existing_neon_redirect.py --apply
      - name: State exact result
        run: echo "Existing Free Worker updated; iPhone signed subscription + Lock Screen still require user validation."
