<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>li. Check-in real-browser QA</title></head>
<body style="margin:0;background:white">
<iframe id="app" title="li. test application" src="../site/index.html" style="height:760px;border:0"></iframe>
<pre id="result">LI_CHECKIN_BROWSER_PENDING</pre>
<script>
"use strict";
const width=Number(new URLSearchParams(location.search).get("w")||390);
const iframe=document.getElementById("app");
iframe.style.width=width+"px";
const result=document.getElementById("result");
const fail=e=>{result.textContent="LI_CHECKIN_BROWSER_FAIL "+(e.stack||e.message||e);};
let loaded=false;setTimeout(()=>{if(!loaded)fail(Error("iframe did not complete load"));},7000);
iframe.addEventListener("load",()=>{
 loaded=true;
 try{
  const d=iframe.contentDocument,w=iframe.contentWindow;
  const by=id=>{const el=d.getElementById(id);if(!el)throw Error("Missing "+id);return el;};
  const check=(condition,message)=>{if(!condition)throw Error(message);};
  const choose=(name,value)=>{
   const el=d.querySelector('input[name="'+name+'"][value="'+value+'"]');
   check(Boolean(el),"missing radio "+name+" "+value);
   el.checked=true;el.dispatchEvent(new w.Event("change",{bubbles:true}));
  };
  const apply=()=>by("apply-checkin").click();
  const open=()=>by("checkin").click();
  const verify=(mode,expectedCount)=>{
   check(d.body.dataset.studyMode===mode,"body study mode "+mode);
   check(w.localStorage.getItem("li.study-mode.v1")===mode,"stored study mode "+mode);
   check(d.querySelector('.ly-mode-choice[data-ly-mode="'+mode+'"]')?.getAttribute("aria-pressed")==="true","Settings pressed state "+mode);
   const img="laoly-mode-"+({start:"start",focus:"focus",overload:"overload",recover:"recover"}[mode])+".png";
   check(by("laoly-current-icon").getAttribute("src").includes(img),"Lão Lý FAB mode "+mode);
   check(by("buddy-title-avatar").getAttribute("src").includes(img),"Lão Lý dialog avatar "+mode);
   check(by("method-count").textContent.includes("Hiển thị "+expectedCount+"/13"),"Thần Chú count for "+mode+": "+by("method-count").textContent);
  };
  open();
  check(by("checkin-modal").classList.contains("open"),"modal must open");
  check(by("apply-checkin").disabled,"empty check-in must not guess");
  const rect=by("checkin-modal").querySelector(".dialog").getBoundingClientRect();
  check(rect.left>=-1&&rect.right<=width+1,"dialog horizontal viewport bounds at "+width+": "+rect.left+".."+rect.right);
  check(rect.bottom<=w.innerHeight+1,"dialog vertical viewport bounds");
  choose("checkin-energy","high");choose("checkin-attention","steady");
  check(by("checkin-recommendation").textContent.includes("Gợi ý: Đào sâu"),"focused recommendation visible");
  apply();verify("focus",13);
  open();choose("checkin-energy","medium");choose("checkin-attention","steady");apply();verify("start",6);
  open();choose("checkin-energy","high");choose("checkin-attention","hard");apply();verify("recover",6);
  open();choose("checkin-energy","low");choose("checkin-attention","hard");apply();verify("overload",3);
  open();
  by("checkin-override").value="focus";
  by("checkin-override").dispatchEvent(new w.Event("change",{bubbles:true}));
  check(by("checkin-recommendation").textContent.includes("thủ công"),"override reason visible");
  apply();verify("focus",13);
  open();by("close-checkin").click();verify("focus",13);
  result.textContent="LI_CHECKIN_BROWSER_PASS "+width+"px · 4 auto mappings, manual override, skip, avatar + method synchronization";
 }catch(e){fail(e);}
});
</script></body></html>
