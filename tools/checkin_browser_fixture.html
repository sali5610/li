<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>li. React L1 Check-in — invited-session browser smoke</title></head>
<body style="margin:0;background:var(--paper,#F1F0E9)">
<iframe id="app" title="li. invited React check-in" src="../site/index.html" style="height:760px;border:0;display:block"></iframe>
<pre id="result" role="status">LI_REACT_CHECKIN_BROWSER_PENDING</pre>
<script>
/* Unlike the retired guest/native fixture, do not fabricate an authorized user.
 * This probe is meaningful only in a valid invited session on the SAME origin. */
const query=new URLSearchParams(location.search),w=Number(query.get("w")||390),h=Number(query.get("h")||760);
const iframe=document.getElementById("app"),result=document.getElementById("result");
iframe.style.width=w+"px";iframe.style.height=h+"px";
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
iframe.addEventListener("load",async()=>{
 try{
  const doc=iframe.contentDocument,win=iframe.contentWindow;
  if(!doc.documentElement.classList.contains("li-auth-verified")){
   result.textContent="LI_REACT_CHECKIN_BROWSER_AUTH_REQUIRED: open the invited staging app and sign in to test the Check-in dialog.";
   return;
  }
  const verify=(condition,message)=>{if(!condition)throw Error(message)};
  win.dispatchEvent(new win.CustomEvent("li:open-checkin",{detail:{triggerId:"checkin"}}));
  await frame();await frame();
  const root=doc.getElementById("checkin-modal");
  verify(root&&root.dataset.reactOwner==="checkin","React Check-in did not mount");
  verify(root.classList.contains("open"),"Modal not visible");
  verify(root.querySelector(".checkin-scroll"),"Missing separately scrolling body");
  verify(root.querySelector(".checkin-actions"),"Missing fixed footer");
  for(const kind of ["sleep","move","rest"]){
   const choices=root.querySelectorAll('input[name="checkin-'+kind+'"]');
   verify(choices.length===2,"Expected two physical answers for "+kind);
   verify([...choices].every(x=>!x.checked),"Stale physical answer for "+kind);
  }
  verify(root.querySelector("#apply-checkin").disabled,"Unanswered form can be applied");
  root.querySelector("#close-checkin").click();await frame();
  verify(!doc.getElementById("checkin-modal"),"Skip must close React modal");
  result.textContent="LI_REACT_CHECKIN_BROWSER_PASS: invited gate, React owner, three physical questions, safe skip.";
 }catch(err){result.textContent="LI_REACT_CHECKIN_BROWSER_FAIL "+(err.stack||err);}
});
</script></body></html>
