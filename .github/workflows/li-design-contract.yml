name: li. Design System Contract

on:
  pull_request:
    paths:
      - 'site/**'
      - 'design-system/**'
      - 'tools/validate_design_system.py'
      - 'tools/validate_ui_foundations.py'
      - 'tools/audit_design_tokens.py'
      - 'AGENTS.md'
      - '.github/workflows/li-design-contract.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'design-system/**'
      - 'tools/validate_design_system.py'
      - 'tools/validate_ui_foundations.py'
      - 'tools/audit_design_tokens.py'
      - 'AGENTS.md'
      - '.github/workflows/li-design-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-design-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated CSS exactly matches JSON source
        run: python3 tools/generate_design_tokens.py --check
      - name: Check current UI token and interaction baseline
        run: python3 tools/validate_design_system.py
      - name: Validate readable type and 4px layout grid
        run: python3 tools/validate_ui_foundations.py
      - name: Enforce ZERO authored component color / type / spacing debt
        run: python3 tools/audit_design_tokens.py --check-zero
      - name: Reject any increases in legacy intrinsic / scene CSS debt
        run: python3 tools/audit_design_tokens.py --check-baseline
      - name: Validate full app routes and native lessons before merge
        run: python3 tools/validate_site.py
      - name: Stage 00 source scanner self-test and complete live-tree inventory
        run: |
          node tools/ds_inventory.mjs --self-test
          node tools/ds_inventory.mjs --check
          node tools/ds_inventory.mjs --write /tmp/li-ux-ds-35-stage00-inventory.json
      - name: Retain full selector/token/screen inventory as reviewable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: li-ux-ds-35-source-inventory
          path: /tmp/li-ux-ds-35-stage00-inventory.json
          retention-days: 14

