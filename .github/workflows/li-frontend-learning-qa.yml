name: L09 React frontend (affected slice only)
on:
  pull_request:
    paths:
      - 'design-system/react/**'
      - 'tools/step16-real-l09-react-island/src/learning/**'
      - 'tools/step16-real-l09-react-island/package.json'
      - 'tools/step16-real-l09-react-island/vite.learning.config.mjs'
      - 'site/assets/lesson-l09-hifi.js'
      - '.github/workflows/li-frontend-learning-qa.yml'
permissions:
  contents: read
jobs:
  frontend-type-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact authored L09 and scoped React compile
        working-directory: tools/step16-real-l09-react-island
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run extract
          npx tsc --noEmit
          npx vite build --config vite.learning.config.mjs
          test -s dist-learning/li-learning.js
          test -s dist-learning/li-learning.css
          echo 'PASS L09_REACT_FRONTEND_COMPILED_NONDEPLOY'
