<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="t d"><title id="t">Open-ended and neutral interviewing</title><desc id="d">Two panels show the danger of a leading question, and the neutral interview path from story to observation to inference.</desc><defs><pattern id="p" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="14" cy="7" r=".7" fill="#8b866f" opacity=".24"/></pattern><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".10"/></filter></defs><rect width="1200" height="550" rx="27" fill="#f3ebdc"/><rect width="1200" height="550" rx="27" fill="url(#p)"/><rect x="22" y="22" width="564" height="505" rx="22" fill="#fcf7ec" stroke="#d2bf9e" filter="url(#s)"/><rect x="614" y="22" width="564" height="505" rx="22" fill="#fcf7ec" stroke="#d2bf9e" filter="url(#s)"/><g font-family="Arial,'Noto Sans',sans-serif" fill="#293c2e"><text x="48" y="65" font-size="25" fill="#293c2e" font-weight="600">01  CÂU DẪN DẮT / LEADING</text><text x="640" y="65" font-size="25" fill="#293c2e" font-weight="600">02  HỎI TRUNG LẬP / NEUTRAL</text><rect x="50" y="118" width="506" height="125" rx="23" fill="#f8e4db" stroke="#bf765c" stroke-width="2"/><text x="73" y="158" font-size="19" fill="#293c2e" font-weight="600">“Bộ lọc mới hữu ích lắm,</text><text x="73" y="191" font-size="19" fill="#293c2e" font-weight="600">đúng không?”</text><text x="73" y="222" font-size="14" fill="#9a4f39" font-weight="400">Assumes agreement / Tiền giả định</text><circle cx="155" cy="312" r="25" fill="#9d6f54"/><rect x="125" y="346" width="60" height="83" rx="22" fill="#9d6f54"/><circle cx="415" cy="312" r="25" fill="#d6b687"/><rect x="385" y="346" width="60" height="83" rx="22" fill="#d6b687"/><path d="M206 341 C284 329 322 330 363 341" fill="none" stroke="#a85043" stroke-width="5" stroke-dasharray="8 10"/><circle cx="285" cy="337" r="31" fill="#b35947"/><text x="274" y="348" font-size="26" fill="#fff" font-weight="800">!</text><text x="51" y="466" font-size="17" fill="#293c2e" font-weight="600">Ý kiến được dẫn hướng trước khi nghe câu chuyện.</text><text x="51" y="490" font-size="14" fill="#777364" font-weight="400">The question supplies the desired answer.</text><rect x="648" y="116" width="500" height="138" rx="23" fill="#e5efe4" stroke="#709374" stroke-width="2"/><text x="668" y="152" font-size="18" fill="#293c2e" font-weight="600">“Lần gần nhất bạn cần lọc theo</text><text x="668" y="182" font-size="18" fill="#293c2e" font-weight="600">quốc gia, bạn đã làm thế nào?”</text><text x="668" y="224" font-size="14" fill="#3b7650" font-weight="400">Ask about a real episode</text><rect x="650" y="284" width="148" height="95" rx="16" fill="#e7d8bb"/><text x="676" y="326" font-size="16" fill="#293c2e" font-weight="600">Kể lại</text><text x="675" y="348" font-size="14" fill="#6f6b59" font-weight="400">Story</text><path d="M800 328 H840" stroke="#64866b" stroke-width="5"/><path d="M830 317 L847 328 L830 339" stroke="#64866b" fill="none" stroke-width="5"/><rect x="849" y="284" width="128" height="95" rx="16" fill="#d5e6d5"/><text x="863" y="326" font-size="16" fill="#293c2e" font-weight="600">Quan sát</text><text x="866" y="348" font-size="14" fill="#55705b" font-weight="400">Observe</text><path d="M978 328 H1015" stroke="#64866b" stroke-width="5"/><path d="M1005 317 L1022 328 L1005 339" stroke="#64866b" fill="none" stroke-width="5"/><rect x="1027" y="284" width="124" height="95" rx="16" fill="#f6e8cb"/><text x="1038" y="326" font-size="16" fill="#293c2e" font-weight="600">Suy luận</text><text x="1039" y="348" font-size="14" fill="#7c6e53" font-weight="400">Infer</text><text x="647" y="456" font-size="17" fill="#293c2e" font-weight="600">Phân biệt lời nói, quan sát và suy luận.</text><text x="647" y="481" font-size="14" fill="#777364" font-weight="400">Separate reported facts from interpretation.</text></g></svg>